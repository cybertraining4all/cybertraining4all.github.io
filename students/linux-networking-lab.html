<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NETLAB - Linux &amp; Networking Fundamentals Lab</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c232c;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#3fb950;--blue:#58a6ff;--yellow:#d29922;--red:#f85149;--term:#0b0e14;--mag:#d2a8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px}
header{height:54px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
header .logo{font-weight:700;font-size:17px;letter-spacing:.3px}
header .logo span{color:var(--accent)}
header .sub{color:var(--muted);font-size:12.5px}
header .grow{flex:1}
.pbar{width:200px;height:8px;background:#21262d;border-radius:4px;overflow:hidden}
.pbar>div{height:100%;background:linear-gradient(90deg,#238636,#3fb950);width:0;transition:width .4s}
.score{font-weight:600;font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
button{background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
button:hover{background:#30363d}
button.primary{background:#238636;border-color:#2ea043;color:#fff}
button.primary:hover{background:#2ea043}
button.danger{color:var(--red)}
main{display:flex;height:calc(100% - 54px)}
#left{width:46%;min-width:360px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel)}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel)}
.tabs button{border:none;border-radius:0;background:none;padding:11px 18px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
.tabs button.on{color:var(--text);border-bottom-color:#f78166}
.pane{flex:1;overflow:auto;padding:16px 20px;display:none}
.pane.on{display:block}
.lnav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.lnav select{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px;font-size:13.5px}
h2{margin:6px 0 4px;font-size:20px}
h4{margin:16px 0 6px;color:var(--blue);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:#1f6feb22;color:var(--blue);border:1px solid #1f6feb55;border-radius:12px;padding:2px 9px;font-size:12px;font-family:monospace;cursor:pointer}
p,li{line-height:1.55}
code{font-family:"Cascadia Code","Fira Code",Consolas,monospace;background:#6e768133;padding:1px 5px;border-radius:4px;font-size:12.5px}
code.run{cursor:pointer;background:#30363d;color:#e6edf3;border:1px solid #484f58}
code.run:hover{background:#238636;border-color:#2ea043}
pre.ex{background:var(--term);border:1px solid var(--border);border-radius:6px;padding:10px 12px;overflow:auto;font-size:12.3px;line-height:1.45;font-family:"Cascadia Code","Fira Code",Consolas,monospace}
.tip{background:#d2992215;border-left:3px solid var(--yellow);padding:8px 12px;border-radius:4px;margin:12px 0;line-height:1.5}
.scenario{background:#1f6feb15;border-left:3px solid var(--blue);padding:10px 14px;border-radius:4px;line-height:1.6}
table.mini{border-collapse:collapse;margin:8px 0}
table.mini td,table.mini th{border:1px solid var(--border);padding:4px 10px;text-align:left}
.section{margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
.section h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between}
.section h3 small{color:var(--muted);font-weight:400}
.task{display:flex;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;background:var(--panel2);align-items:flex-start}
.task .box{width:18px;height:18px;border-radius:50%;border:2px solid #484f58;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px}
.task.done{border-color:#2ea04366;background:#2386361a}
.task.done .box{background:var(--accent);border-color:var(--accent);color:#000}
.task .t{flex:1}
.task .hint{display:none;margin-top:6px;color:var(--muted);font-size:13px}
.task.showhint .hint{display:block}
.task .hbtn{font-size:11.5px;padding:2px 8px}
.q{padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;background:var(--panel2)}
.q .qt{margin-bottom:7px}
.q input[type=text]{background:var(--term);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 8px;width:62%;font-family:monospace}
.q.ok{border-color:#2ea04366;background:#2386361a}
.q .fb{margin-left:8px;font-size:13px}
.q .fb.good{color:var(--accent)}.q .fb.bad{color:var(--red)}
.q label{display:block;padding:3px 0;cursor:pointer}
.navbtns{display:flex;justify-content:space-between;margin:18px 0 8px}
/* Docs */
.doclist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.doclist button{font-family:monospace;padding:4px 10px}
.doclist button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.doc dt{font-family:monospace;color:var(--accent);margin-top:6px}
.doc dd{margin:2px 0 4px 18px;color:var(--text)}
.doc .syn{white-space:pre;overflow:auto;font-family:monospace;background:var(--term);padding:8px 10px;border-radius:6px;border:1px solid var(--border)}
.doc .pkg{color:var(--muted);font-size:12px}
/* Progress */
table.prog{width:100%;border-collapse:collapse;font-size:13px}
table.prog th,table.prog td{border-bottom:1px solid var(--border);padding:6px 6px;text-align:left}
table.prog td.n{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:34px;font-weight:700}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row input{background:var(--term);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 8px}
/* Terminal */
.tbar{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#161b22;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.tbar .dot{width:11px;height:11px;border-radius:50%}
.tbar .grow{flex:1;text-align:center}
#term{flex:1;overflow-y:auto;background:var(--term);padding:10px 14px;font-family:"Cascadia Code","Fira Code","JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;font-size:13.5px;line-height:1.38;white-space:pre-wrap;word-break:break-all;cursor:text}
#term .err{color:#ff7b72}
#term .dir{color:#58a6ff;font-weight:600}
#term .match{color:#ff5555;font-weight:700}
#term .magenta{color:#bc8cff}
#term .p1{color:#3fb950}
#term .pu{color:#58a6ff;font-weight:700}
#term .pr{color:#ff5555;font-weight:700}
#term .pd{color:#e6edf3;font-weight:700}
#term .sys{color:#8b949e}
#inline{display:inline}
#cmd{background:transparent;border:none;outline:none;color:#e6edf3;font:inherit;padding:0;margin:0;width:60%;caret-color:#3fb950}
.toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:20}
.toast div{background:#238636;color:#fff;padding:9px 14px;border-radius:6px;box-shadow:0 4px 16px #0008;font-size:13px;animation:pop .25s ease-out;max-width:380px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.legend{color:var(--muted);font-size:12px;margin-top:4px}
@media (max-width:900px){main{flex-direction:column}#left{width:100%;height:50%;min-width:0}#right{height:50%}}
</style>
</head>

// ===== Hash functions (real MD5 / SHA-256 over UTF-8 bytes) =====
function utf8Bytes(s){return new TextEncoder().encode(s);}
function md5(str){
  const b=utf8Bytes(str);const n=b.length;const words=new Uint32Array((((n+8)>>>6)+1)*16);
  for(let i=0;i<n;i++)words[i>>2]|=b[i]<<((i%4)*8);
  words[n>>2]|=0x80<<((n%4)*8);words[words.length-2]=(n*8)>>>0;words[words.length-1]=Math.floor(n/0x20000000);
  const S=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K=[];for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0;
  let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  for(let o=0;o<words.length;o+=16){
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){
      let F,g;
      if(i<16){F=(B&C)|(~B&D);g=i;}else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16;}
      else if(i<48){F=B^C^D;g=(3*i+5)%16;}else{F=C^(B|~D);g=(7*i)%16;}
      F=(F+A+K[i]+words[o+g])>>>0;A=D;D=C;C=B;B=(B+((F<<S[i])|(F>>>(32-S[i]))))>>>0;
    }
    a0=(a0+A)>>>0;b0=(b0+B)>>>0;c0=(c0+C)>>>0;d0=(d0+D)>>>0;
  }
  return [a0,b0,c0,d0].map(x=>{let h='';for(let i=0;i<4;i++)h+=((x>>>(i*8))&255).toString(16).padStart(2,'0');return h;}).join('');
}

function sha256(str){
  const b=utf8Bytes(str);const n=b.length;const total=(((n+8)>>>6)+1)*64;const m=new Uint8Array(total);m.set(b);m[n]=0x80;
  const bits=n*8;const dv=new DataView(m.buffer);dv.setUint32(total-4,bits>>>0);dv.setUint32(total-8,Math.floor(bits/4294967296));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W=new Uint32Array(64);const r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<total;o+=64){
    for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3);const s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0;}
    let [a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25);const ch=(e&f)^(~e&g);const t1=(h+S1+ch+SHA_K[i]+W[i])>>>0;const S0=r(a,2)^r(a,13)^r(a,22);const mj=(a&bb)^(a&c)^(bb&c);const t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;}
    H=[H[0]+a,H[1]+bb,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x>>>0);
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

CMDS.cd=async c=>{let t=c.args[0]||HOME;if(t==='-')t=SH.oldpwd||HOME;const p=normPath(t);const n=SH.fs[p];
  if(!n){c.err(`bash: cd: ${t}: No such file or directory\n`);return 1;}if(n.type!=='dir'){c.err(`bash: cd: ${t}: Not a directory\n`);return 1;}
  if(n.root&&!SH.root){c.err(`bash: cd: ${t}: Permission denied\n`);return 1;}SH.oldpwd=SH.cwd;SH.cwd=p;SH.env.PWD=p;TERM.updatePrompt();};
const fileSize=n=>n.type==='dir'?4096:utf8Bytes(typeof n.content==='string'?n.content:n.content.raw).length;
CMDS.ls=async c=>{
  const o=getopt(c.args,'lahd1R');const targets=o._.length?o._:['.'];let code=0;
  const fmt=(name,n)=>{
    if(!o.l)return null;
    const perm=n.type==='dir'?(n.root?'drwx------':'drwxr-xr-x'):(n.root?'-rw-r-----':'-rw-r--r--');
    const own=n.root?'root     root    ':'student  student ';let sz=fileSize(n);let s=String(sz);
    if(o.h&&sz>=1024)s=(sz/1024).toFixed(1)+'K';
    return `${perm} 1 ${own}${s.padStart(5)} Nov  5 09:14 `;
  };
  for(const t of targets){
    const p=normPath(t);const n=SH.fs[p];
    if(!n){c.err(`ls: cannot access '${t}': No such file or directory\n`);code=2;continue;}
    if(n.type==='file'){const f=fmt(t,n);c.out((f||'')+t+'\n');continue;}
    if(n.root&&!c.root){c.err(`ls: cannot open directory '${t}': Permission denied\n`);code=2;continue;}
    if(targets.length>1)c.out(t+':\n');
    let names=fsList(p);if(o.a)names=['.','..'].concat(names);else names=names.filter(x=>!x.startsWith('.'));
    if(o.l){c.out(`total ${names.length*4}\n`);}
    const items=names.map(nm=>{const nn=nm==='.'||nm==='..'?{type:'dir'}:SH.fs[p==='/'?'/'+nm:p+'/'+nm];return {nm,nn};});
    if(o.l||!c.tty||o['1']){items.forEach(({nm,nn})=>{c.out((fmt(nm,nn)||''));c.out(nm,nn.type==='dir'&&c.tty?'dir':undefined);c.out('\n');});}
    else{items.forEach(({nm,nn},k)=>{c.out(nm,nn.type==='dir'?'dir':undefined);c.out(k<items.length-1?'  ':'\n');});}
    if(targets.length>1)c.out('\n');
  }
  return code;
};
CMDS.ll=async c=>CMDS.ls(Object.assign(c,{args:['-l'].concat(c.args)}));
CMDS.cat=async c=>{
  const o=getopt(c.args,'nbAE');let files=o._;let code=0;let ln=1;
  const emit=d=>{if(o.n||o.b){const lines=d.split('\n');const last=lines.pop();lines.forEach(l=>{if(o.b&&!l)c.out('\n');else c.out(String(ln++).padStart(6)+'\t'+l+(o.E?'$':'')+'\n');});if(last)c.out(String(ln++).padStart(6)+'\t'+last);}else c.out(o.E?d.replace(/\n/g,'$\n'):d);};
  if(!files.length||files[0]==='-'){emit(c.stdin||'');return 0;}
  for(const f of files){const r=readFile(f,'cat');if(r.err){c.err(r.err+'\n');code=1;continue;}emit(r.data);}
  return code;
};
CMDS.echo=async c=>{let a=c.args.slice();let nl=true,esc=false;while(a[0]&&/^-[neE]+$/.test(a[0])){if(a[0].includes('n'))nl=false;if(a[0].includes('e'))esc=true;a.shift();}
  let s=a.join(' ');if(esc)s=s.replace(/\\r/g,'\r').replace(/\\n/g,'\n').replace(/\\t/g,'\t');c.out(s+(nl?'\n':''));};
CMDS.printf=async c=>{const [f,...rest]=c.args;if(f===undefined){c.err('printf: usage: printf format [arguments]\n');return 1;}let i=0;

CMDS.mkdir=async c=>{for(const f of c.args.filter(a=>!a.startsWith('-'))){const p=normPath(f);if(SH.fs[p]){c.err(`mkdir: cannot create directory '${f}': File exists\n`);return 1;}SH.fs[p]={type:'dir'};}};
CMDS.rm=async c=>{const o=getopt(c.args,'rfi');for(const f of o._){const p=normPath(f);const n=SH.fs[p];if(!n){if(!o.f)c.err(`rm: cannot remove '${f}': No such file or directory\n`);continue;}
  if(!p.startsWith(HOME+'/')&&!p.startsWith('/tmp/')&&!c.root){c.err(`rm: cannot remove '${f}': Permission denied\n`);return 1;}

CMDS.cp=async c=>{const a=c.args.filter(x=>!x.startsWith('-'));if(a.length!==2){c.err('cp: missing file operand\n');return 1;}const r=readFile(a[0],'cp');if(r.err){c.err(r.err.replace('cp: ','cp: cannot stat ')+'\n');return 1;}

CMDS.which=async c=>{let code=0;for(const a of c.args){if(CMDS[a])c.out((['ifconfig','arp','route','tcpdump','hping3'].includes(a)?'/usr/sbin/':'/usr/bin/')+a+'\n');else code=1;}return code;};
function inputLines(c,files,cmd){
  if(!files.length)return {text:c.stdin||''};
  let t='';for(const f of files){const r=readFile(f,cmd);if(r.err){c.err(r.err+'\n');continue;}t+=r.data;}return {text:t};
}
CMDS.grep=async c=>{
  const o=getopt(c.args,'ivncEowrlh');if(!o._.length){c.err('Usage: grep [OPTION]... PATTERNS [FILE]...\n');return 2;}
  const pat=o._[0];const files=o._.slice(1);let re;
  try{let src=pat;if(!o.E){src=pat.replace(/\\\|/g,'\u0001').replace(/\\\(/g,'\u0002').replace(/\\\)/g,'\u0003').replace(/[+?{}()|]/g,'\\$&').replace(/\u0001/g,'|').replace(/\u0002/g,'(').replace(/\u0003/g,')');}if(o.w)src='\\b(?:'+src+')\\b';re=new RegExp(src,o.i?'gi':'g');}catch(e){c.err('grep: Invalid regular expression\n');return 2;}
  let count=0;const multi=files.length>1;
  const srcs=files.length?files.map(f=>{const r=readFile(f,'grep');if(r.err){c.err(r.err+'\n');return null;}return [f,r.data];}).filter(Boolean):[[null,c.stdin||'']];
  for(const [fname,text] of srcs){
    const lines=text.split('\n');if(lines[lines.length-1]==='')lines.pop();let fc=0;
    lines.forEach((l,idx)=>{
      re.lastIndex=0;const hit=re.test(l);re.lastIndex=0;
      if(hit===!o.v){count++;fc++;
        if(o.c||o.l)return;
        const pre=(multi&&!o.h?fname+':':'')+(o.n?(idx+1)+':':'');
        if(pre)c.out(pre,c.tty?'magenta':undefined);
        if(o.o&&!o.v){(l.match(re)||[]).forEach(m=>{c.out(m,c.tty?'match':undefined);c.out('\n');});return;}
        if(c.tty&&!o.v){let last=0;l.replace(re,(m,...rest)=>{const off=rest[rest.length-2];c.out(l.slice(last,off));c.out(m,'match');last=off+m.length;return m;});c.out(l.slice(last)+'\n');}
        else c.out(l+'\n');
      }
    });
    if(o.c)c.out((multi?fname+':':'')+fc+'\n');
    if(o.l&&fc)c.out(fname+'\n');
  }
  return count?0:1;
};
CMDS.head=async c=>{const o=getopt(c.args,'n:c:');let n=parseInt(o.n||10);o._=o._.filter(a=>{if(/^-\d+$/.test(a)){n=+a.slice(1);return false;}return true;});const {text}=inputLines(c,o._,'head');const l=text.split('\n');if(l[l.length-1]==='')l.pop();l.slice(0,n).forEach(x=>c.out(x+'\n'));};

CMDS.wc=async c=>{const o=getopt(c.args,'lwc');const {text}=inputLines(c,o._,'wc');const L=(text.match(/\n/g)||[]).length,W=(text.match(/\S+/g)||[]).length,C=utf8Bytes(text).length;
  const sel=o.l||o.w||o.c;const parts=[];if(!sel||o.l)parts.push(L);if(!sel||o.w)parts.push(W);if(!sel||o.c)parts.push(C);
  c.out((sel&&parts.length===1?String(parts[0]):parts.map(x=>String(x).padStart(sel?1:7)).join(' '))+(o._.length?' '+o._[0]:'')+'\n');};
CMDS.sort=async c=>{const o=getopt(c.args,'rnu');const {text}=inputLines(c,o._,'sort');let l=text.split('\n');if(l[l.length-1]==='')l.pop();
  l.sort(o.n?(a,b)=>parseFloat(a)-parseFloat(b):undefined);if(o.r)l.reverse();if(o.u)l=[...new Set(l)];l.forEach(x=>c.out(x+'\n'));};
CMDS.uniq=async c=>{const o=getopt(c.args,'c');const {text}=inputLines(c,o._,'uniq');let l=text.split('\n');if(l[l.length-1]==='')l.pop();
  const res=[];l.forEach(x=>{if(res.length&&res[res.length-1][0]===x)res[res.length-1][1]++;else res.push([x,1]);});res.forEach(([x,n])=>c.out((o.c?String(n).padStart(7)+' ':'')+x+'\n'));};
CMDS.awk=async c=>{const prog=c.args[0]||'';const m=prog.match(/^\{\s*print\s+([$\d,\s]+)\s*\}$/);if(!m){c.err('awk: this lab only supports simple programs like \'{print $1}\'\n');return 2;}

// ===== Interface / routing / neighbor commands =====
const IFACES={
  lo:{idx:1,flags:'LOOPBACK,UP,LOWER_UP',mtu:65536,state:'UNKNOWN',mac:'00:00:00:00:00:00',ip:'127.0.0.1',pfx:8,v6:'::1/128',rx:[18432,214],tx:[18432,214]},
  eth0:{idx:2,flags:'BROADCAST,MULTICAST,UP,LOWER_UP',mtu:1500,state:'UP',mac:ME.mac,ip:ME.ip,pfx:24,brd:'10.10.10.255',v6:'fe80::250:56ff:fea1:3c50/64',rx:[48211933,61877],tx:[6120554,30211]},
  eth1:{idx:3,flags:'BROADCAST,MULTICAST',mtu:1500,state:'DOWN',mac:'00:50:56:a1:3c:51',rx:[0,0],tx:[0,0]},
};
function ipAddrText(names,o){
  let s='';
  for(const n of names){const i=IFACES[n];
    if(o.br){s+=`${n.padEnd(17)}${i.state.padEnd(15)}${i.ip?i.ip+'/'+i.pfx+' ':''}${o.v4?'':i.v6?i.v6+' ':''}\n`;continue;}
    s+=`${i.idx}: ${n}: <${i.flags}> mtu ${i.mtu} qdisc ${n==='lo'?'noqueue':n==='eth0'?'fq_codel':'noop'} state ${i.state} group default qlen 1000\n`;
    s+=`    link/${n==='lo'?'loopback':'ether'} ${i.mac} brd ${n==='lo'?'00:00:00:00:00:00':'ff:ff:ff:ff:ff:ff'}${n==='eth0'?'\n    altname enp2s1':''}\n`;
    if(o.link)continue;
    if(i.ip&&!o.v6)s+=`    inet ${i.ip}/${i.pfx} ${i.brd?'brd '+i.brd+' ':''}scope ${n==='lo'?'host':'global dynamic noprefixroute'} ${n}\n       valid_lft ${n==='lo'?'forever':'85912sec'} preferred_lft ${n==='lo'?'forever':'85912sec'}\n`;
    if(i.v6&&!o.v4)s+=`    inet6 ${i.v6} scope ${n==='lo'?'host':'link'} noprefixroute \n       valid_lft forever preferred_lft forever\n`;
  }
  return s;
}
function linkBrief(names){return names.map(n=>{const i=IFACES[n];return `${n.padEnd(17)}${i.state.padEnd(15)}${i.mac} <${i.flags}> \n`;}).join('');}
const ROUTES=[
  {dst:'0.0.0.0',gw:'10.10.10.1',mask:'0.0.0.0',flags:'UG',metric:100,cidr:'default',proto:'dhcp'},
  {dst:'10.10.10.0',gw:'0.0.0.0',mask:'255.255.255.0',flags:'U',metric:100,cidr:'10.10.10.0/24',proto:'kernel'},
  {dst:'10.10.20.0',gw:'10.10.10.254',mask:'255.255.255.0',flags:'UG',metric:0,cidr:'10.10.20.0/24',proto:'static'},
];
function routeFor(ip){if(ip.startsWith('127.'))return {dev:'lo'};if(inLan(ip))return {dev:'eth0',gw:null};if(ip.startsWith('10.10.20.'))return {dev:'eth0',gw:'10.10.10.254'};return {dev:'eth0',gw:'10.10.10.1'};}
function ipRouteText(){return `default via 10.10.10.1 dev eth0 proto dhcp src 10.10.10.50 metric 100 \n10.10.10.0/24 dev eth0 proto kernel scope link src 10.10.10.50 metric 100 \n10.10.20.0/24 via 10.10.10.254 dev eth0 proto static \n`;}
function neighText(){return Object.entries(SH.arp).sort((a,b)=>ipNum(a[0])-ipNum(b[0])).map(([ip,e])=>e.mac?`${ip} dev eth0 lladdr ${e.mac} ${e.state}\n`:`${ip} dev eth0 FAILED \n`).join('');}
const ipNum=ip=>ip.split('.').reduce((a,b)=>a*256+(+b),0);
CMDS.ip=async c=>{
  const o={};let a=c.args.slice();
  while(a[0]&&a[0].startsWith('-')){const f=a.shift();if(f==='-br'||f==='-brief')o.br=1;else if(f==='-4')o.v4=1;else if(f==='-6')o.v6=1;else if(f==='-c'||f==='-color'||f==='--color'){}else if(f==='-s')o.s=1;else{c.err(`Option "${f}" is unknown, try "ip -help".\n`);return 255;}}
  const obj=a.shift()||'';const sub=a[0]||'show';
  const match=(full,min)=>obj.length>=min&&full.startsWith(obj);
  if(!obj||obj==='help'||obj==='-help'||obj==='--help'){c.out('Usage: ip [ OPTIONS ] OBJECT { COMMAND | help }\nwhere  OBJECT := { address | link | neigh | route | ... }\n       OPTIONS := { -4 | -6 | -br[ief] | -s[tatistics] | -c[olor] }\nTry: ip a | ip -br a | ip route | ip neigh | ip link\n');return obj?0:255;}
  if(match('address',1)){
    if(['add','del','flush','change','replace'].includes(sub)){if(!c.root){c.err('RTNETLINK answers: Operation not permitted\n');return 2;}c.out('');c.err('netlab: address changes are disabled in this lab so the network stays consistent.\n');return 2;}
    let names=Object.keys(IFACES);const dv=a.indexOf('dev');const nm=dv>=0?a[dv+1]:(sub==='show'&&a[1]?a[1]:null);
    if(nm){if(!IFACES[nm]){c.err(`Device "${nm}" does not exist.\n`);return 1;}names=[nm];}
    c.out(ipAddrText(names,o));return 0;
  }
  if(match('link',1)){
    if(sub==='set'){if(!c.root){c.err('RTNETLINK answers: Operation not permitted\n');return 2;}
      const dev=a[1];const st=a[2];if(!IFACES[dev]){c.err(`Cannot find device "${dev}"\n`);return 1;}
      if(dev==='eth0'&&st==='down'){c.err('netlab: refusing to take eth0 down - you would lose the whole lab network!\n');return 2;}
      if(dev==='eth1'){if(st==='up'){IFACES.eth1.flags='NO-CARRIER,BROADCAST,MULTICAST,UP';IFACES.eth1.state='DOWN';}else{IFACES.eth1.flags='BROADCAST,MULTICAST';IFACES.eth1.state='DOWN';}}
      return 0;}
    let names=Object.keys(IFACES);if(a[1]&&IFACES[a[1]])names=[a[1]];
    c.out(o.br?linkBrief(names):ipAddrText(names,Object.assign({link:1},o)));return 0;
  }
  if(match('route',1)){
    if(sub==='get'){const t=a[1];if(!t||!isIP(t)){c.err('Error: any valid address is expected rather than "'+(t||'')+'".\n');return 1;}const r=routeFor(t);
      c.out(r.dev==='lo'?`local ${t} dev lo table local src 127.0.0.1 uid 1000 \n    cache <local> \n`:`${t} ${r.gw?'via '+r.gw+' ':''}dev eth0 src 10.10.10.50 uid 1000 \n    cache \n`);return 0;}
    if(['add','del','delete','replace','change','flush'].includes(sub)){if(!c.root){c.err('RTNETLINK answers: Operation not permitted\n');return 2;}c.err('netlab: the routing table is read-only in this lab.\n');return 2;}
    c.out(ipRouteText());return 0;
  }
  if(match('neighbour',1)||obj==='neighbor'){if(sub==='flush'){if(!c.root){c.err('Failed to send flush request: Operation not permitted\n');return 2;}Object.keys(SH.arp).forEach(k=>delete SH.arp[k]);return 0;}c.out(neighText());return 0;}
  c.err(`Object "${obj}" is unknown, try "ip help".\n`);return 1;
};
const hb=b=>b>=1e6?(b/1e6).toFixed(1)+' MB':b>=1000?(b/1000).toFixed(1)+' KB':b+'.0 B';
function ifconfigText(n){const i=IFACES[n];let s='';
  const up=i.state!=='DOWN'||i.flags.includes('UP,');
  if(n==='lo')s+=`lo: flags=73<UP,LOOPBACK,RUNNING>  mtu 65536\n        inet 127.0.0.1  netmask 255.0.0.0\n        inet6 ::1  prefixlen 128  scopeid 0x10<host>\n        loop  txqueuelen 1000  (Local Loopback)\n`;
  else if(n==='eth0')s+=`eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500\n        inet 10.10.10.50  netmask 255.255.255.0  broadcast 10.10.10.255\n        inet6 fe80::250:56ff:fea1:3c50  prefixlen 64  scopeid 0x20<link>\n        ether ${i.mac}  txqueuelen 1000  (Ethernet)\n`;
  else s+=`eth1: flags=${up?'4099<UP,BROADCAST,MULTICAST>':'4098<BROADCAST,MULTICAST>'}  mtu 1500\n        ether ${i.mac}  txqueuelen 1000  (Ethernet)\n`;
  s+=`        RX packets ${i.rx[1]}  bytes ${i.rx[0]} (${hb(i.rx[0])})\n        RX errors 0  dropped 0  overruns 0  frame 0\n        TX packets ${i.tx[1]}  bytes ${i.tx[0]} (${hb(i.tx[0])})\n        TX errors 0  dropped 0 overruns 0  carrier 0  collisions 0\n\n`;
  return s;}
CMDS.ifconfig=async c=>{const a=c.args;
  if(a[0]==='-a'||!a.length){const names=a[0]==='-a'?['eth0','eth1','lo']:['eth0','lo'];c.out(names.map(ifconfigText).join(''));return 0;}
  const n=a[0];if(!IFACES[n]){c.err(`${n}: error fetching interface information: Device not found\n`);return 1;}
  if(a.length>1){if(!c.root){c.err('SIOCSIFFLAGS: Operation not permitted\n');return 1;}if(n==='eth0'&&a[1]==='down'){c.err('netlab: refusing to take eth0 down - you would lose the whole lab network!\n');return 1;}if(n==='eth1'){IFACES.eth1.state='DOWN';IFACES.eth1.flags=a[1]==='up'?'NO-CARRIER,BROADCAST,MULTICAST,UP':'BROADCAST,MULTICAST';}return 0;}
  c.out(ifconfigText(n));};
function routeTable(numeric){
  const nm=ip=>numeric?ip:(ip==='0.0.0.0'?(numeric?ip:'0.0.0.0'):(PTR[ip]||ip));

CMDS.ping=async c=>{

  if(o.help||o.h||!o._.length){c.out('\nUsage\n  ping [options] <destination>\n\nOptions:\n  -c <count>     stop after <count> replies\n  -i <interval>  seconds between sending each packet\n  -s <size>      use <size> as number of data bytes to be sent\n  -W <timeout>   time to wait for response\n  -n             no dns name resolution\n  -q             quiet output\n');return o._.length?0:2;}
  const tgt=o._[0];const r=resolve(tgt);
  if(!r){c.err(`ping: ${tgt}: ${tgt.includes('.')||true?'Name or service not known':''}\n`);return 2;}
  const count=o.c?parseInt(o.c):Infinity;let iv=o.i?parseFloat(o.i):1;if(iv<0.2&&!c.root){c.err('ping: cannot flood; minimal interval allowed for user is 200ms\n');return 2;}
  const size=o.s?parseInt(o.s):56;const ip=r.ip;const h=hostInfo(ip);
  const disp=isIP(tgt)?ip:(r.canon||r.name);
  c.out(`PING ${disp} (${ip}) ${size}(${size+28}) bytes of data.\n`);
  let sent=0,recv=0,errs=0;const rtts=[];const t0=Date.now();
  const reach=h&&h.icmp;const local=ip.startsWith('127.')||ip===ME.ip;
  const lanDead=!h&&inLan(ip);
  if(inLan(ip))touchArp(ip);else nextHopArp(ip);
  try{
    for(let seq=1;seq<=count;seq++){
      sent++;
      if(reach||local){const rt=local?rnd(0.04):rnd(h.rtt);rtts.push(rt);recv++;
        if(!o.q){const who=isIP(tgt)||o.n?ip:`${PTR[ip]||disp} (${ip})`;c.out(`${size+8} bytes from ${who}: icmp_seq=${seq} ttl=${local?64:h.ttl} time=${fmtMs(rt)} ms\n`);}
        GRADER.onEvent('ping-reply',{ip});}
      else if(lanDead&&seq%3===0){errs+=3;if(!o.q)for(let k=seq-2;k<=seq;k++)c.out(`From ${ME.ip} icmp_seq=${k} Destination Host Unreachable\n`);}
      if(seq>=count)break;
      await c.sleep(iv*1000);

    if(!reach&&!local&&count!==Infinity)await c.sleep(Math.min(3000,(o.W?parseFloat(o.W):1)*1000));
  }catch(e){if(!(e instanceof Interrupt))throw e;c.out('^C');SH.intr=false;}
  const el=Date.now()-t0;const loss=Math.round((sent-recv)/sent*100);
  c.out(`\n--- ${disp} ping statistics ---\n${sent} packets transmitted, ${recv} received,${errs?` +${errs} errors,`:''} ${loss}% packet loss, time ${Math.max(0,el-1)}ms\n`);
  if(recv){const mn=Math.min(...rtts),mx=Math.max(...rtts),av=rtts.reduce((a,b)=>a+b,0)/rtts.length;const md=Math.sqrt(rtts.reduce((a,b)=>a+(b-av)**2,0)/rtts.length);c.out(`rtt min/avg/max/mdev = ${mn.toFixed(3)}/${av.toFixed(3)}/${mx.toFixed(3)}/${md.toFixed(3)} ms\n`);}
  else if(lanDead)c.out('pipe 3\n');
  GRADER.onEvent('ping',{ip,sent,recv,loss,target:tgt});
  return recv?0:1;
};

CMDS.traceroute=async c=>{
  const o=getopt(c.args,'nITm:q:p:w:46');
  if(o.help||!o._.length){c.out('Usage:\n  traceroute [ -46dFITnreAUDV ] [ -f first_ttl ] [ -m max_ttl ] [ -p port ] [ -q nqueries ] [ -w waittime ] host\nOptions:\n  -I  Use ICMP ECHO for tracerouting (root)\n  -T  Use TCP SYN for tracerouting (root, default port 80)\n  -n  Do not resolve IP addresses to their domain names\n  -m  Set the max number of hops (default 30)\n  -q  Set the number of probes per each hop (default 3)\n');return o._.length?0:2;}
  if((o.I||o.T)&&!c.root){c.err('You do not have enough privileges to use this traceroute method.\nsocket: Operation not permitted\n');return 1;}
  const tgt=o._[0];const r=resolve(tgt);if(!r){c.err(`${tgt}: Name or service not known\nCannot handle "host" cmdline arg \`${tgt}' on position 1 (argc ${c.args.length})\n`);return 2;}
  const ip=r.ip;const max=parseInt(o.m||30);const q=parseInt(o.q||3);const mode=o.T?'T':o.I?'I':'U';
  let path=pathTo(ip,mode);

  c.out(`traceroute to ${isIP(tgt)?ip:tgt} (${ip}), ${max} hops max, ${o.T?'60':o.I?'60':'60'} byte packets\n`);
  nextHopArp(ip);let reached=false;let hops=0;
  if(inLan(ip)&&!HOSTS[ip]){await c.sleep(3000);c.out(` 1  ${o.n?ME.ip:'netlab.lab.local ('+ME.ip+')'}  3061.402 ms !H  3061.311 ms !H  3061.290 ms !H\n`);GRADER.onEvent('traceroute',{ip,target:tgt,reached:false,hops:1,mode});return 0;}
  try{

      hops=hop;const e=path[hop-1];await c.sleep(e?120:350);

    else if(a.type==='AAAA')c.out(`Name:\t${n}\nAddress: ${a.data}\n`);

      sent++;const rp=reply(seq);
      if(rp){recv++;const rt=local?rnd(0.05):rnd(h.rtt);rtts.push(rt);const id=Math.floor(Math.random()*60000);
        if(rp==='icmp')c.out(`len=28 ip=${ip} ttl=${ttl} id=${id} icmp_seq=${seq} rtt=${rt.toFixed(1)} ms\n`);
        else if(rp==='unreach')c.out(`ICMP Port Unreachable from ip=${ip} name=${PTR[ip]||'UNKNOWN'}\nstatus=0 port=${2000+seq} seq=${seq}\n`);
        else c.out(`len=${rp==='SA'?44:40} ip=${ip} ttl=${ttl} DF id=${rp==='SA'?0:id} sport=${port} flags=${rp} seq=${seq} win=${rp==='SA'?64240:0} rtt=${rt.toFixed(1)} ms\n`);
        GRADER.onEvent('hping-reply',{ip,port,mode,flags:rp,syn:!!o.S});}
      if(seq+1>=count)break;
      await c.sleep(1000);
    }
    if(recv<sent&&count!==Infinity)await c.sleep(900);
  }catch(e){if(!(e instanceof Interrupt))throw e;c.out('^C');SH.intr=false;}
  const loss=Math.round((sent-recv)/sent*100);
  c.out(`\n--- ${tgt} hping statistic ---\n${sent} packets transmitted, ${recv} packets received, ${loss}% packet loss\nround-trip min/avg/max = ${recv?`${Math.min(...rtts).toFixed(1)}/${(rtts.reduce((a,b)=>a+b,0)/rtts.length).toFixed(1)}/${Math.max(...rtts).toFixed(1)}`:'0.0/0.0/0.0'} ms\n`);
  GRADER.onEvent('hping',{ip,port,mode,S:!!o.S,A:!!o.A,recv,sent,target:tgt});
  return 0;
};

// ===== md5sum / sha256sum =====
function hashCmd(name,fn,len){
  return async c=>{
    const o=getopt(c.args,'cbtw');if(o.check)o.c=true;if(o.quiet)o.q=true;if(c.args.includes('--status'))o.status=true;
    if(o.help){c.out(`Usage: ${name} [OPTION]... [FILE]...\nPrint or check ${name==='md5sum'?'MD5 (128-bit)':'SHA256 (256-bit)'} checksums.\n\nWith no FILE, or when FILE is -, read standard input.\n  -c, --check   read checksums from the FILEs and check them\n      --quiet   don't print OK for each successfully verified file\n`);return 0;}
    let files=o._;
    if(o.c){
      let bad=0,missing=0,okc=0,code=0;const results=[];
      const lists=files.length?files.map(f=>{const r=readFile(f,name);if(r.err){c.err(r.err+'\n');return '';}return r.data;}):[c.stdin||''];
      for(const txt of lists){for(const line of txt.split('\n')){const m=line.match(new RegExp(`^([0-9a-fA-F]{${len}})\\s+\\*?(.+)$`));if(!line.trim())continue;if(!m){continue;}
        const fn2=m[2].trim();const r=readFile(fn2,name);
        if(r.err){c.out(`${fn2}: FAILED open or read\n`);c.err(r.err+'\n');missing++;results.push([fn2,'MISSING']);continue;}
        const ok=fn(r.data)===m[1].toLowerCase();if(ok){okc++;if(!o.q&&!o.quiet)c.out(`${fn2}: OK\n`);}else{bad++;c.out(`${fn2}: FAILED\n`);}results.push([fn2,ok?'OK':'FAILED']);}}
      if(missing)c.err(`${name}: WARNING: ${missing} listed file${missing>1?'s':''} could not be read\n`);
      if(bad)c.err(`${name}: WARNING: ${bad} computed checksum${bad>1?'s':''} did NOT match\n`);
      GRADER.onEvent('hash-check',{algo:name,results,cwd:SH.cwd});
      return bad||missing?1:0;
    }
    if(!files.length)files=['-'];let code=0;const results=[];
    for(const f of files){
      let data;if(f==='-'){data=c.stdin||'';}else{const r=readFile(f,name);if(r.err){c.err(r.err+'\n');code=1;continue;}data=r.data;}
      const h=fn(data);c.out(`${h}  ${f}\n`);results.push({file:f==='-'?'-':normPath(f),hash:h,data});
    }
    GRADER.onEvent('hash',{algo:name,results});
    return code;
  };
}
CMDS.md5sum=hashCmd('md5sum',md5,32);CMDS.sha256sum=hashCmd('sha256sum',sha256,64);

function docToText(k,d){
  const w=(t)=>t.replace(/(.{1,72})(\s+|$)/g,'       $1\n');
  let s=`${k.toUpperCase()}(8)                 NETLAB Manual                 ${k.toUpperCase()}(8)\n\nNAME\n       ${k} - ${d.summary}\n\nSYNOPSIS\n${d.synopsis.split('\n').map(l=>'       '+l).join('\n')}\n\nDESCRIPTION\n${w(d.desc)}\nOPTIONS\n`;
  d.options.forEach(([o,x])=>s+=`       ${o}\n              ${x}\n`);
  s+=`\nEXAMPLES\n`;d.examples.forEach(([e,x])=>s+=`       $ ${e}\n              ${x}\n`);
  s+=`\nREADING THE OUTPUT\n${w(d.read)}\nTIP\n${w(d.tips)}\nPACKAGE\n       ${d.pkg}\n\n`;
  return s;
}

{id:'basics',title:'1. Terminal basics: whoami & cat',cmds:['whoami','cat'],
 body:`<p>Welcome to <b>NETLAB</b>. The terminal on the right is a simulated Kali Linux workstation called <code>netlab</code> on a small company network, <code>lab.local</code>. Nothing you type leaves your browser.</p>
<h4>Anatomy of a command</h4>
<pre class="ex">command  -options  arguments
cat      -n        /etc/hosts</pre>
<p>The <b>prompt</b> <code>┌──(student㉿netlab)-[~]</code> tells you <i>who</i> you are (student), <i>where</i> (host netlab) and the current directory (<code>~</code> = your home folder). The <code>$</code> means a normal user; <code>#</code> means root.</p>
<h4>whoami</h4>
<p>Prints the user your commands run as. Prefix any command with <code>sudo</code> to run it as <b>root</b> (the administrator). Your sudo password is anything non-empty, e.g. <code>student</code>.</p>
<h4>cat</h4>
<p>Prints files. Use <code>ls</code> to list files and <code>cd</code> to change directories. <code>-n</code> numbers the lines.</p>
<div class="tip">Click any grey command in a lesson - like <code class="run">whoami</code> - to paste it into the terminal, then press Enter. Press <b>Tab</b> to auto-complete and <b>↑</b> for history. Type <code class="run">man cat</code> or use the <b>Docs</b> tab for full documentation.</div>`,
 tasks:[
  {id:'b1',text:'Find out who you are logged in as.',cmd:'whoami',hint:'Type <code class="run">whoami</code>',...C('whoami',ev=>!ev.sudo)},
  {id:'b2',text:'Run whoami as root using sudo.',cmd:'sudo whoami',hint:'<code class="run">sudo whoami</code> - enter any password.',...C('whoami',ev=>ev.sudo)},
  {id:'b3',text:'List your home directory, then read README.txt with cat.',cmd:'cat README.txt',hint:'<code class="run">ls</code> then <code class="run">cat README.txt</code>',...C('cat',ev=>ev.output.includes('NETLAB{welcome_aboard}'))},
  {id:'b4',text:'Print /etc/hosts with line numbers.',cmd:'cat -n /etc/hosts',hint:'<code class="run">cat -n /etc/hosts</code>',...C('cat',ev=>has(ev,/ -n /)&&ev.output.includes('localhost'))},
  {id:'b5',text:'Open the manual page for any lab command.',cmd:'man cat',hint:'<code class="run">man cat</code>',...E('man')},
 ],
 quiz:[
  {id:'bq1',q:'What is the flag inside README.txt?',a:['NETLAB{welcome_aboard}'],hint:'cat README.txt'},
  {id:'bq2',q:'Which user does <code>sudo whoami</code> report?',a:['root']},
  {id:'bq3',q:'According to /etc/hosts, which IP is files01 mapped to?',a:['10.10.10.30']},
 ]},
{id:'iface',title:'2. Network interfaces: ip a & ifconfig',cmds:['ip','ifconfig'],
 body:`<p>Every network conversation starts at an <b>interface</b> - a network card (physical or virtual). Each has a <b>MAC address</b> (layer 2, burned into the NIC) and usually one or more <b>IP addresses</b> (layer 3).</p>
<h4>ip a (modern)</h4>
<pre class="ex">2: eth0: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; ... state UP
    link/ether 00:50:56:a1:3c:50          &lt;- MAC address
    inet 10.10.10.50/24 brd 10.10.10.255  &lt;- IPv4 / prefix length</pre>
<p><code>/24</code> is CIDR notation: the first 24 bits are the network, so the netmask is <code>255.255.255.0</code> and all <code>10.10.10.x</code> hosts are on your local subnet. <code>lo</code> (127.0.0.1) is the loopback interface - the machine talking to itself.</p>
<h4>ifconfig (legacy)</h4>
<p>Older but still everywhere in docs, on macOS and on network appliances. Plain <code>ifconfig</code> hides interfaces that are down - use <code>-a</code> to see everything.</p>`,
 tasks:[
  {id:'i1',text:'Show all interfaces and addresses with ip.',hint:'<code class="run">ip a</code>',...C('ip',ev=>/^a/.test(ev.args.filter(x=>!x.startsWith('-'))[0]||'')&&!has(ev,/-br/))},
  {id:'i2',text:'Show the brief one-line view.',hint:'<code class="run">ip -br a</code>',...C('ip',ev=>has(ev,/ -br /))},
  {id:'i3',text:'Show active interfaces with ifconfig.',hint:'<code class="run">ifconfig</code>',...C('ifconfig',ev=>ev.code===0&&ev.output.includes('eth0'))},
  {id:'i4',text:'Use ifconfig to reveal the interface that is down.',hint:'<code class="run">ifconfig -a</code>',...C('ifconfig',ev=>ev.output.includes('eth1'))},
 ],
 quiz:[
  {id:'iq1',q:'What is the IPv4 address of eth0?',a:['10.10.10.50','10.10.10.50/24']},
  {id:'iq2',q:'What is the MAC address of eth0?',a:['00:50:56:a1:3c:50']},
  {id:'iq3',q:'Which interface is DOWN?',a:['eth1']},
  {id:'iq4',q:'eth0 is a /24. What is its netmask in dotted-decimal?',a:['255.255.255.0']},
 ]},
{id:'route',title:'3. Routing: route & ip route',cmds:['route','ip'],
 body:`<p>The <b>routing table</b> decides where each packet goes. If the destination is on a directly connected subnet, the packet is delivered directly. Otherwise it is sent to a <b>gateway</b> (router). The <b>default route</b> (<code>0.0.0.0/0</code>) catches everything else.</p>
<pre class="ex">Destination  Gateway       Genmask        Flags
0.0.0.0      10.10.10.1    0.0.0.0        UG    &lt;- default gateway
10.10.10.0   0.0.0.0       255.255.255.0  U     &lt;- local subnet
10.10.20.0   10.10.10.254  255.255.255.0  UG    &lt;- static route</pre>
<p>Flags: <b>U</b> = up, <b>G</b> = via a gateway. The <b>most specific</b> matching route wins, so traffic to <code>10.10.20.5</code> uses the static route, not the default.</p>
<p><code>ip route get &lt;IP&gt;</code> asks the kernel exactly which route it would choose.</p>`,
 tasks:[
  {id:'r1',text:'Show the routing table numerically with route.',hint:'<code class="run">route -n</code>',...C('route',ev=>has(ev,/ -n/))},
  {id:'r2',text:'Show the routing table with ip.',hint:'<code class="run">ip route</code>',...C('ip',ev=>/^r/.test(ev.args.filter(x=>!x.startsWith('-'))[0]||'')&&ev.args.length<=2)},
  {id:'r3',text:'Ask the kernel which route it uses to reach 8.8.8.8.',hint:'<code class="run">ip route get 8.8.8.8</code>',...C('ip',ev=>has(ev,/ get /)&&ev.code===0)},
  {id:'r4',text:'Ask which route it uses to reach the DMZ host 10.10.20.5.',hint:'<code class="run">ip route get 10.10.20.5</code>',...C('ip',ev=>has(ev,/ get 10\.10\.20\./))},
 ],
 quiz:[
  {id:'rq1',q:'What is the default gateway?',a:['10.10.10.1']},
  {id:'rq2',q:'Which gateway is used to reach the 10.10.20.0/24 DMZ?',a:['10.10.10.254']},
  {id:'rq3',q:'In route -n output, what does the G flag mean?',choices:['The route is a gateway-less local subnet','Packets for this destination are sent via a gateway (router)','The route is generated by DHCP','The route is disabled'],answer:1},
 ]},
{id:'ping',title:'4. Reachability: ping',cmds:['ping'],
 body:`<p><code>ping</code> sends ICMP <i>echo request</i> packets and waits for <i>echo replies</i>. It answers: is the host reachable, how fast (RTT), and is anything lost?</p>
<pre class="ex">64 bytes from web01.lab.local (10.10.10.20): icmp_seq=1 ttl=64 time=0.51 ms</pre>
<ul><li><b>ttl</b> - hops left. Common starting values: Linux 64, Windows 128, routers 255. A LAN host showing <code>ttl=128</code> is probably Windows.</li>
<li><b>time</b> - round-trip time. LAN &lt; 1 ms, Internet 10-100 ms.</li>
<li>On Linux ping runs <b>forever</b> - use <code>-c 4</code> or press <b>Ctrl+C</b>.</li></ul>
<p><b>Failure modes:</b> <i>Destination Host Unreachable</i> from your own IP = nobody answered ARP on the local subnet. Plain <i>100% packet loss</i> = no reply at all, often because a firewall drops ICMP - the host may still be up!</p>`,
 tasks:[
  {id:'p1',text:'Send exactly 4 pings to the default gateway.',hint:'<code class="run">ping -c 4 10.10.10.1</code>',...E('ping',d=>d.ip==='10.10.10.1'&&d.sent>=4&&d.recv>0)},
  {id:'p2',text:'Ping web01 by name (DNS does the lookup).',hint:'<code class="run">ping -c 3 web01</code>',...E('ping',d=>d.ip==='10.10.10.20'&&!isIP(d.target)&&d.recv>0)},
  {id:'p3',text:'Ping dc01 and note its TTL.',hint:'<code class="run">ping -c 3 dc01</code>',...E('ping',d=>d.ip==='10.10.10.10'&&d.recv>0)},
  {id:'p4',text:'Ping Google DNS on the Internet.',hint:'<code class="run">ping -c 3 8.8.8.8</code>',...E('ping',d=>d.ip==='8.8.8.8'&&d.recv>0)},
  {id:'p5',text:'Ping an address with no host behind it: 10.10.10.99.',hint:'<code class="run">ping -c 3 10.10.10.99</code>',...E('ping',d=>d.ip==='10.10.10.99')},
  {id:'p6',text:'Ping hardened.lab.local - a host that blocks ICMP.',hint:'<code class="run">ping -c 3 hardened.lab.local</code>',...E('ping',d=>d.ip==='10.10.20.5')},
 ],
 quiz:[
  {id:'pq1',q:'What TTL do replies from 8.8.8.8 have?',a:['117']},
  {id:'pq2',q:'dc01 replies with ttl=128. Which OS family does that usually indicate?',choices:['Linux','Windows','Cisco IOS','macOS'],answer:1},
  {id:'pq3',q:'What packet loss percentage did you get for 10.10.10.99? (number only)',a:['100','100%']},
  {id:'pq4',q:'hardened.lab.local does not answer ping. What can you conclude?',choices:['The host is definitely down','Nothing for certain - ICMP may simply be filtered','DNS is broken','Your gateway is down'],answer:1},
 ]},
{id:'arp',title:'5. Neighbors: arp',cmds:['arp','ip'],
 body:`<p>IP addresses get packets across networks, but on the local Ethernet segment frames are delivered by <b>MAC address</b>. <b>ARP</b> asks "who has 10.10.10.30? tell 10.10.10.50" and caches the answer.</p>
<pre class="ex">Address        HWtype  HWaddress           Flags  Iface
10.10.10.1     ether   00:1c:7f:3a:10:01   C      eth0
10.10.10.99            (incomplete)               eth0</pre>
<p>You only learn MACs of <b>local</b> hosts you talk to. For Internet hosts your machine sends frames to the <b>gateway's</b> MAC, so 8.8.8.8 never appears in the table. <i>(incomplete)</i> means a request went out and nobody answered.</p>
<div class="tip">Security note: if two different IPs suddenly share one MAC (especially the gateway's IP), suspect ARP spoofing / man-in-the-middle.</div>`,
 tasks:[
  {id:'a1',text:'Display the ARP cache numerically.',hint:'<code class="run">arp -n</code>',...C('arp',ev=>has(ev,/ -n/)||has(ev,/ -an/))},
  {id:'a2',text:'Ping files01 once, then confirm its MAC appears in the ARP cache.',hint:'<code class="run">ping -c 1 files01</code> then <code class="run">arp -a</code>',...C('arp',ev=>ev.output.includes('10.10.10.30'))},
  {id:'a3',text:'View the same table with the modern ip neigh.',hint:'<code class="run">ip neigh</code>',...C('ip',ev=>/^n/.test(ev.args.filter(x=>!x.startsWith('-'))[0]||''))},
  {id:'a4',text:'Find the (incomplete) entry left by pinging 10.10.10.99.',hint:'Ping 10.10.10.99 (lesson 4), then <code class="run">arp -n</code>',...C('arp',ev=>ev.output.includes('10.10.10.99')&&ev.output.includes('incomplete'))},
 ],
 quiz:[
  {id:'aq1',q:'What is the MAC address of the default gateway (10.10.10.1)?',a:['00:1c:7f:3a:10:01']},
  {id:'aq2',q:'What is the MAC address of files01?',a:['00:50:56:a1:7d:30']},
  {id:'aq3',q:'Why will 8.8.8.8 never appear in your ARP cache?',choices:['ARP only works with private IPs','8.8.8.8 is not on your local subnet - frames go to the gateway\'s MAC','8.8.8.8 blocks ARP','ARP entries for public IPs expire immediately'],answer:1},
 ]},
{id:'nslookup',title:'6. DNS basics: nslookup',cmds:['nslookup'],
 body:`<p><b>DNS</b> turns names into IP addresses (and back). Your resolver is set in <code>/etc/resolv.conf</code> - here <code>10.10.10.10</code> (dc01) with search domain <code>lab.local</code>.</p>
<p>Common record types: <b>A</b> (IPv4), <b>AAAA</b> (IPv6), <b>CNAME</b> (alias), <b>MX</b> (mail server), <b>NS</b> (name servers), <b>TXT</b> (free text: SPF, verification), <b>PTR</b> (reverse: IP → name).</p>
<pre class="ex">Server:   10.10.10.10            &lt;- who answered
Name:     web01.lab.local
Address:  10.10.10.20</pre>
<p><b>Split-horizon DNS:</b> internal names (<code>*.lab.local</code>) exist only on the internal DNS server. Ask a public resolver like 8.8.8.8 and you get <b>NXDOMAIN</b> (non-existent domain).</p>`,
 tasks:[
  {id:'n1',text:'Look up web01 (the search domain completes the name).',hint:'<code class="run">nslookup web01</code>',...E('dns',d=>d.tool==='nslookup'&&d.name==='web01.lab.local'&&d.status==='NOERROR')},
  {id:'n2',text:'Look up intranet.lab.local and spot the CNAME.',hint:'<code class="run">nslookup intranet.lab.local</code>',...E('dns',d=>d.tool==='nslookup'&&/^intranet/.test(d.name)&&d.status==='NOERROR')},
  {id:'n3',text:'Do a reverse lookup of 10.10.10.25.',hint:'<code class="run">nslookup 10.10.10.25</code>',...E('dns',d=>d.tool==='nslookup'&&d.type==='PTR'&&d.name.startsWith('25.10.10.10'))},
  {id:'n4',text:'Find the mail server (MX) for lab.local.',hint:'<code class="run">nslookup -type=mx lab.local</code>',...E('dns',d=>d.tool==='nslookup'&&d.type==='MX')},
  {id:'n5',text:'Ask the public resolver 8.8.8.8 for web01.lab.local.',hint:'<code class="run">nslookup web01.lab.local 8.8.8.8</code>',...E('dns',d=>d.tool==='nslookup'&&d.server==='8.8.8.8'&&/lab\.local/.test(d.name))},
 ],
 quiz:[
  {id:'nq1',q:'intranet.lab.local is an alias. What is its canonical name?',a:['web01.lab.local','web01.lab.local.','web01']},
  {id:'nq2',q:'Which host name belongs to 10.10.10.25?',a:['mail.lab.local','mail.lab.local.','mail']},
  {id:'nq3',q:'What status does 8.8.8.8 return for web01.lab.local?',a:['NXDOMAIN']},
  {id:'nq4',q:'Which DNS server answers your queries by default?',a:['10.10.10.10','dc01','dc01.lab.local']},
 ]},
{id:'dig',title:'7. DNS deep dive: dig',cmds:['dig'],
 body:`<p><code>dig</code> shows the <i>whole</i> DNS response - the tool admins and security analysts reach for first.</p>
<pre class="ex">;; -&gt;&gt;HEADER&lt;&lt;- opcode: QUERY, status: NOERROR
;; flags: qr rd ra; QUERY: 1, ANSWER: 1
;; ANSWER SECTION:
example.com.     300   IN   A   93.184.215.14
                 ^TTL (seconds it may be cached)</pre>
<p>Flags: <b>qr</b> response, <b>aa</b> authoritative answer (the server owns the zone), <b>rd</b>/<b>ra</b> recursion desired/available.</p>
<p>Useful forms: <code>dig +short name</code>, <code>dig name MX</code>, <code>dig -x IP</code>, <code>dig @1.1.1.1 name</code>.</p>
<div class="tip">Unlike nslookup and ping, dig does <b>not</b> apply the search domain. <code>dig web01</code> asks for the top-level name "web01." - always use fully qualified names with dig.</div>`,
 tasks:[
  {id:'d1',text:'Run a full dig for example.com.',hint:'<code class="run">dig example.com</code>',...E('dns',d=>d.tool==='dig'&&!d.short&&d.name.replace(/\.$/,'')==='example.com'&&d.type==='A')},
  {id:'d2',text:'Get just the answer with +short.',hint:'<code class="run">dig +short example.com</code>',...E('dns',d=>d.tool==='dig'&&d.short)},
  {id:'d3',text:'Read the TXT records for lab.local.',hint:'<code class="run">dig lab.local TXT</code>',...E('dns',d=>d.tool==='dig'&&d.type==='TXT'&&/lab\.local/.test(d.name))},
  {id:'d4',text:'Reverse-lookup 8.8.8.8 with dig.',hint:'<code class="run">dig -x 8.8.8.8</code>',...E('dns',d=>d.tool==='dig'&&d.type==='PTR')},
  {id:'d5',text:'Query a specific server: Cloudflare 1.1.1.1.',hint:'<code class="run">dig @1.1.1.1 example.com</code>',...E('dns',d=>d.tool==='dig'&&d.server==='1.1.1.1')},
  {id:'d6',text:'See what happens with a short name: dig web01',hint:'<code class="run">dig web01</code>',...E('dns',d=>d.tool==='dig'&&d.name==='web01')},
 ],
 quiz:[
  {id:'dq1',q:'What flag is hidden in the lab.local TXT records?',a:['NETLAB{txt_records_tell_tales}']},
  {id:'dq2',q:'What is the TTL (seconds) of the example.com A record?',a:['300']},
  {id:'dq3',q:'What status does <code>dig web01</code> return?',a:['NXDOMAIN']},
  {id:'dq4',q:'Answers for lab.local names include the <b>aa</b> flag. What does it mean?',choices:['Answer was cached','Authoritative answer - the server owns the zone','Answer is encrypted','Additional answers follow'],answer:1},
 ]},
{id:'trace',title:'8. Path discovery: traceroute',cmds:['traceroute'],
 body:`<p><code>traceroute</code> reveals each router between you and a destination. It sends probes with TTL=1, 2, 3... Each router that drops a probe because TTL hit zero sends back "ICMP time exceeded", revealing its address.</p>
<pre class="ex"> 1  fw01.lab.local (10.10.10.1)  0.512 ms  0.488 ms  0.471 ms
 2  100.64.0.1 (100.64.0.1)  4.112 ms  4.301 ms  4.087 ms
 3  * * *          &lt;- this hop didn't answer (normal)</pre>
<p>Linux traceroute uses <b>UDP</b> probes by default. If a firewall drops them, you see stars to the end. Switch probe type: <code>-I</code> (ICMP) or <code>-T -p 443</code> (TCP SYN to a port that's allowed) - both need root. Press <b>Ctrl+C</b> to stop a long trace.</p>`,
 tasks:[
  {id:'t1',text:'Trace the path to example.com.',hint:'<code class="run">traceroute example.com</code>',...E('traceroute',d=>d.ip==='93.184.215.14'&&d.reached)},
  {id:'t2',text:'Trace to 8.8.8.8 without name resolution.',hint:'<code class="run">traceroute -n 8.8.8.8</code>',...C('traceroute',ev=>has(ev,/ -n/)&&has(ev,/8\.8\.8\.8/))},
  {id:'t3',text:'Trace to hardened.lab.local with default UDP probes (Ctrl+C when bored).',hint:'<code class="run">traceroute hardened.lab.local</code>',...C('traceroute',ev=>has(ev,/hardened/)&&!has(ev,/ -T/))},
  {id:'t4',text:'Reach hardened.lab.local using TCP SYN probes to port 443.',hint:'<code class="run">sudo traceroute -T -p 443 hardened.lab.local</code>',...E('traceroute',d=>d.ip==='10.10.20.5'&&d.reached&&d.mode==='T')},
 ],
 quiz:[
  {id:'tq1',q:'How many hops is example.com away?',a:['7']},
  {id:'tq2',q:'What is the first hop on the way to hardened.lab.local?',a:['10.10.10.254','fw-dmz.lab.local','fw-dmz']},
  {id:'tq3',q:'What does a line of <code>* * *</code> mean?',choices:['The route is broken and nothing gets through','That hop did not reply to the probes (filtered or rate-limited)','The destination was reached','DNS resolution failed'],answer:1},
 ]},
{id:'netstat',title:'9. Sockets: netstat',cmds:['netstat'],
 body:`<p>A <b>socket</b> is an endpoint: IP + port + protocol. <code>netstat</code> shows what is <b>listening</b> (services waiting for connections) and what is <b>connected</b>.</p>
<pre class="ex">netstat -tulpn
  -t TCP  -u UDP  -l listening  -p program  -n numeric</pre>
<ul><li><code>0.0.0.0:22</code> - listening on <b>all</b> interfaces: reachable from the network.</li>
<li><code>127.0.0.1:631</code> - loopback only: reachable from this machine only.</li>
<li><b>-p</b> shows other users' programs only when run as root.</li></ul>
<div class="tip">Investigating a possibly compromised host? An unexpected listener owned by root on an odd port is a red flag.</div>`,
 tasks:[
  {id:'s1',text:'List listening TCP and UDP ports numerically.',hint:'<code class="run">netstat -tuln</code>',...E('netstat',d=>d.opts.l&&d.opts.n&&d.opts.t)},
  {id:'s2',text:'Show listeners with program names as a normal user (notice what\'s hidden).',hint:'<code class="run">netstat -tulpn</code>',...E('netstat',d=>d.opts.l&&d.opts.p&&!d.root)},
  {id:'s3',text:'Now show them with sudo to reveal every program.',hint:'<code class="run">sudo netstat -tulpn</code>',...E('netstat',d=>d.opts.l&&d.opts.p&&d.root)},
  {id:'s4',text:'Show only established connections using a pipe to grep.',hint:'<code class="run">netstat -tan | grep ESTABLISHED</code>',...C('grep',ev=>/ESTAB/i.test(ev.line)&&/netstat|ss/.test(ev.line)&&ev.output.length>0)},
 ],
 quiz:[
  {id:'sq1',q:'Which program listens on TCP 8080?',a:['python3','python']},
  {id:'sq2',q:'Which program listens on TCP 31337 (needs sudo to see)?',a:['nc','netcat']},
  {id:'sq3',q:'Which remote IP has an SSH session to you?',a:['10.10.10.5']},
  {id:'sq4',q:'PostgreSQL listens on 127.0.0.1:5432. Can web01 connect to it?',choices:['Yes, any host on the LAN can','No - it only listens on loopback','Only with sudo','Only over UDP'],answer:1},
 ]},
{id:'nc',title:'10. Netcat: nc',cmds:['nc'],
 body:`<p>Netcat reads and writes raw bytes over TCP/UDP - the "swiss army knife" of networking.</p>
<h4>Port check</h4><pre class="ex">nc -zv web01 80
web01.lab.local [10.10.10.20] 80 (http) open</pre>
<p><b>open</b> = TCP handshake completed. <b>Connection refused</b> = host replied with RST (up, but nothing listening). <b>timed out</b> = no reply (firewall dropping).</p>
<h4>Banner grabbing</h4><p>Many services announce themselves: <code>nc web01 22</code> shows the SSH version. Press <b>Ctrl+C</b> to quit.</p>
<h4>Speak a protocol by hand</h4><pre class="ex">printf "GET /api/status HTTP/1.0\\r\\n\\r\\n" | nc web01 80</pre>
<h4>Listen</h4><p><code>nc -lvnp 4444</code> waits for a connection. In this lab, a script on files01 will connect to port 4444 a few seconds after you start listening.</p>`,
 tasks:[
  {id:'c1',text:'Check whether TCP/80 is open on web01.',hint:'<code class="run">nc -zv web01 80</code>',...E('nc-scan',d=>d.ip==='10.10.10.20'&&d.ports.includes(80))},
  {id:'c2',text:'Scan the range 20-25 on web01.',hint:'<code class="run">nc -zv web01 20-25</code>',...E('nc-scan',d=>d.ip==='10.10.10.20'&&d.ports.length>=6&&d.ports.includes(20)&&d.ports.includes(25))},
  {id:'c3',text:'Grab the SSH banner from web01 (Ctrl+C to exit).',hint:'<code class="run">nc web01 22</code>',...E('nc-connect',d=>d.ip==='10.10.10.20'&&d.port===22)},
  {id:'c4',text:'Grab the SMTP banner from mail on port 25.',hint:'<code class="run">nc mail 25</code> then type <code>QUIT</code>',...E('nc-connect',d=>d.ip==='10.10.10.25'&&d.port===25)},
  {id:'c5',text:'Send a raw HTTP request to web01 through nc.',hint:'<code class="run">printf "GET /api/status HTTP/1.0\\r\\n\\r\\n" | nc web01 80</code>',...E('nc-http',d=>d.ip==='10.10.10.20')},
  {id:'c6',text:'Start a listener on port 4444 and receive the message.',hint:'<code class="run">nc -lvnp 4444</code>',...E('nc-listen-flag')},
  {id:'c7',text:'Type a reply back through your listener.',hint:'While nc -lvnp 4444 is connected, type something and press Enter.',...E('nc-chat',d=>d.reply&&d.reply.trim().length>0)},
 ],

{id:'curl',title:'11. Web requests: curl',cmds:['curl'],
 body:`<p><code>curl</code> speaks HTTP(S) for you - fetch pages, call APIs, inspect headers, download files.</p>
<pre class="ex">curl -I http://web01
HTTP/1.1 200 OK            &lt;- status code
Server: Apache/2.4.62 (Debian)
Content-Type: text/html</pre>
<p>Status codes: <b>2xx</b> OK, <b>3xx</b> redirect (see <code>Location</code>), <b>4xx</b> client error, <b>5xx</b> server error. <code>-L</code> follows redirects.</p>
<p>HTTPS servers in lab.local use certificates from an internal CA your machine doesn't trust, so curl refuses with error <b>(60)</b>. <code>-k</code> skips verification - acceptable in a lab, risky in production.</p>
<p>Error decoder: <b>(6)</b> DNS failed · <b>(7)</b> connection refused · <b>(28)</b> timeout · <b>(60)</b> certificate problem.</p>`,
 tasks:[
  {id:'u1',text:'Fetch the home page of web01.',hint:'<code class="run">curl http://web01</code>',...E('curl',d=>d.ip==='10.10.10.20'&&d.path==='/'&&d.status===200&&!d.head)},
  {id:'u2',text:'Show only the response headers.',hint:'<code class="run">curl -I http://web01</code>',...E('curl',d=>d.head&&d.status)},
  {id:'u3',text:'Call the JSON API mentioned in the page source.',hint:'<code class="run">curl http://web01/api/status</code>',...E('curl',d=>d.path==='/api/status'&&d.status===200)},
  {id:'u4',text:'Follow the intranet redirect with -L and hit the certificate error.',hint:'<code class="run">curl -L http://intranet.lab.local</code>',...E('curl',d=>d.error===60)},
  {id:'u5',text:'Retry, accepting the lab certificate.',hint:'<code class="run">curl -kL http://intranet.lab.local</code>',...E('curl',d=>d.tls&&d.insecure&&d.status===200)},
  {id:'u6',text:'Download the tool archive keeping its file name.',hint:'<code class="run">curl -O http://web01/downloads/netlab-tool.tar.gz</code>',...E('curl-save',d=>/netlab-tool\.tar\.gz$/.test(d.file))},
  {id:'u7',text:'Find your public IP address via ifconfig.me.',hint:'<code class="run">curl ifconfig.me</code>',...E('curl',d=>d.ip==='34.160.111.145'&&d.status===200)},
 ],

  {id:'uq1',q:'What is the full Server header returned by web01?',a:['Apache/2.4.62 (Debian)']},

  {id:'uq3',q:'Which HTTP status code does http://intranet.lab.local return (before following)?',a:['301']},
  {id:'uq4',q:'What is your public IP address?',a:['198.51.100.77']},
 ]},
{id:'tcpdump',title:'12. Packet capture: tcpdump',cmds:['tcpdump'],
 body:`<p><code>tcpdump</code> captures packets off the wire. Capturing needs root, so use <code>sudo</code>. Your NIC is connected to a <b>mirror (SPAN) port</b>, so you can see other hosts' traffic too.</p>
<pre class="ex">10:15:02.1 IP 10.10.10.77.53122 &gt; 10.10.10.10.53: 4821+ A? updates.lab.local. (35)
           src.port               dst.port        DNS query for an A record</pre>
<p>TCP flags: <b>[S]</b> SYN, <b>[S.]</b> SYN-ACK, <b>[.]</b> ACK, <b>[P.]</b> data, <b>[F.]</b> FIN, <b>[R]</b> reset.</p>
<p>Filters: <code>icmp</code>, <code>arp</code>, <code>port 53</code>, <code>host 10.10.10.77</code>, <code>src</code>/<code>dst</code>, combined with <code>and</code>/<code>or</code>/<code>not</code>. Options: <code>-n</code> no name lookups, <code>-c N</code> stop after N packets, <code>-A</code> show payload as text, <code>-w</code>/<code>-r</code> write/read a pcap file.</p>
<div class="tip">Press <b>Ctrl+C</b> to stop a capture without <code>-c</code>.</div>`,
 tasks:[
  {id:'k1',text:'List the capture interfaces.',hint:'<code class="run">sudo tcpdump -D</code>',...C('tcpdump',ev=>has(ev,/ -D /)&&ev.code===0)},
  {id:'k2',text:'Capture 10 packets on eth0.',hint:'<code class="run">sudo tcpdump -i eth0 -c 10</code>',...E('tcpdump-done',d=>d.count>=10&&!d.filter)},
  {id:'k3',text:'Capture only ICMP and find out who is pinging you.',hint:'<code class="run">sudo tcpdump -n -c 4 icmp</code>',...E('tcpdump-done',d=>/icmp/.test(d.filter)&&d.count>0)},
  {id:'k4',text:'Capture DNS traffic (port 53).',hint:'<code class="run">sudo tcpdump -nn -c 4 port 53</code>',...E('tcpdump-done',d=>/53|domain/.test(d.filter)&&d.count>0)},
  {id:'k5',text:'Capture HTTP with payload in ASCII and find the credentials.',hint:'<code class="run">sudo tcpdump -A -c 8 port 80</code>',...E('tcpdump-done',d=>(d.o.A||d.o.X)&&(d.shown||[]).some(p=>p.payload&&String(p.payload).includes('pass=')))},
  {id:'k6',text:'Save 20 packets to capture.pcap, then read the file back.',hint:'<code class="run">sudo tcpdump -c 20 -w capture.pcap</code> then <code class="run">tcpdump -r capture.pcap</code>',...E('tcpdump-read')},
 ],
 quiz:[
  {id:'kq1',q:'Which IP address is pinging your machine?',a:['10.10.10.30','files01','files01.lab.local']},
  {id:'kq2',q:'Which name is 10.10.10.77 looking up in DNS?',a:['updates.lab.local','updates.lab.local.']},
  {id:'kq3',q:'What password was sent in cleartext over HTTP?',a:['Summer2026!']},
  {id:'kq4',q:'Why can you see SSH traffic in the capture but not read its content?',choices:['tcpdump cannot decode port 22','SSH is encrypted','You need -X instead of -A','SSH uses UDP'],answer:1},
 ]},
{id:'hping',title:'13. Packet crafting: hping3',cmds:['hping3'],
 body:`<p><code>hping3</code> builds custom packets - pick the protocol, flags and port - and shows how the target responds. It needs raw sockets, so run it with <code>sudo</code>.</p>
<pre class="ex">sudo hping3 -S -p 443 -c 3 hardened.lab.local
len=44 ip=10.10.20.5 ttl=63 DF id=0 sport=443 flags=SA ...</pre>
<table class="mini"><tr><th>Reply</th><th>Meaning</th></tr><tr><td><b>flags=SA</b></td><td>SYN-ACK → port <b>open</b></td></tr><tr><td><b>flags=RA</b></td><td>RST-ACK → port <b>closed</b>, host is up</td></tr><tr><td>no reply</td><td><b>filtered</b> - a firewall dropped it</td></tr></table>
<p>This is how you prove a host is alive when ICMP ping is blocked - remember hardened.lab.local from lesson 4?</p>
<div class="tip">Ethics: packet crafting and scanning are only OK on systems you own or have written permission to test. Flood/spoof options are disabled here.</div>`,
 tasks:[
  {id:'h1',text:'Send 3 ICMP echoes to web01 with hping3.',hint:'<code class="run">sudo hping3 -1 -c 3 web01</code>',...E('hping',d=>d.mode==='icmp'&&d.ip==='10.10.10.20'&&d.recv>0)},
  {id:'h2',text:'Send SYNs to TCP 443 on hardened.lab.local.',hint:'<code class="run">sudo hping3 -S -p 443 -c 3 hardened.lab.local</code>',...E('hping',d=>d.ip==='10.10.20.5'&&d.port===443&&d.S&&d.recv>0)},
  {id:'h3',text:'Send SYNs to TCP 22 on hardened.lab.local.',hint:'<code class="run">sudo hping3 -S -p 22 -c 3 hardened.lab.local</code>',...E('hping',d=>d.ip==='10.10.20.5'&&d.port===22&&d.S)},
  {id:'h4',text:'Send SYNs to a closed port: 8080 on web01.',hint:'<code class="run">sudo hping3 -S -p 8080 -c 3 web01</code>',...E('hping',d=>d.ip==='10.10.10.20'&&d.port===8080&&d.S)},
 ],
 quiz:[
  {id:'hq1',q:'Which TCP flags come back from an OPEN port?',a:['SA','SYN-ACK','SYN ACK','SYN/ACK']},
  {id:'hq2',q:'Which TCP flags come back from a CLOSED port?',a:['RA','RST-ACK','RST ACK','RST/ACK']},
  {id:'hq3',q:'Port 22 on hardened.lab.local is...',choices:['open','closed','filtered'],answer:2},
  {id:'hq4',q:'Is hardened.lab.local up, even though ping fails?',choices:['Yes - it answered TCP 443','No','Cannot tell'],answer:0},
 ]},
{id:'hash',title:'14. File integrity: md5sum & sha256sum',cmds:['md5sum','sha256sum'],
 body:`<p>A <b>hash</b> is a fixed-length fingerprint of data. Change one bit and the hash changes completely. Use it to verify downloads, detect tampering and find duplicate files.</p>
<pre class="ex">sha256sum netlab-tool.tar.gz
7b0c...e91f  netlab-tool.tar.gz</pre>
<p><b>md5sum</b> (128-bit) is fast but cryptographically broken - attackers can craft collisions. Use <b>sha256sum</b> for anything security-related.</p>
<p>Verify a list of published hashes: <code>sha256sum -c SHA256SUMS</code> prints <b>OK</b> or <b>FAILED</b> per file.</p>
<div class="tip"><code>echo hello</code> adds a newline. <code>echo -n hello</code> doesn't - and the hashes differ! Try both.</div>`,
 tasks:[
  {id:'m1',text:'Hash the string "hello" (no newline) with md5sum.',hint:'<code class="run">echo -n hello | md5sum</code>',...E('hash',d=>d.algo==='md5sum'&&d.results.some(r=>r.file==='-'&&r.data==='hello'))},
  {id:'m2',text:'MD5 all the PDFs in ~/evidence to find duplicates.',hint:'<code class="run">md5sum ~/evidence/*.pdf</code>',...E('hash',d=>d.algo==='md5sum'&&d.results.filter(r=>/evidence\/.*\.pdf$/.test(r.file)).length>=3)},
  {id:'m3',text:'Verify the evidence folder against its SHA256SUMS list.',hint:'<code class="run">cd ~/evidence</code> then <code class="run">sha256sum -c SHA256SUMS</code>',...E('hash-check',d=>d.algo==='sha256sum'&&d.results.some(r=>r[0].includes('invoice-0424')&&r[1]==='FAILED'))},
  {id:'m4',text:'Compute the SHA-256 of the downloaded netlab-tool.tar.gz.',hint:'Download it (lesson 11), then <code class="run">sha256sum netlab-tool.tar.gz</code>',...E('hash',d=>d.algo==='sha256sum'&&d.results.some(r=>/netlab-tool\.tar\.gz$/.test(r.file)))},
  {id:'m5',text:'Download the vendor SHA256SUMS and verify the tool with -c.',hint:'<code class="run">curl -O http://web01/downloads/SHA256SUMS</code> then <code class="run">sha256sum -c SHA256SUMS</code> (in the same folder as the tool)',...E('hash-check',d=>d.algo==='sha256sum'&&d.results.some(r=>r[0].includes('netlab-tool')&&r[1]==='OK'))},
 ],
 quiz:[
  {id:'mq1',q:'What is the MD5 of "hello" (no newline)?',a:['5d41402abc4b2a76b9719d911017c592']},
  {id:'mq2',q:'Which two evidence files are identical?',choices:['invoice-0423.pdf and invoice-0424.pdf','invoice-0423.pdf and invoice-0423-copy.pdf','invoice-0424.pdf and invoice-0423-copy.pdf','None are identical'],answer:1},
  {id:'mq3',q:'Which evidence file FAILED verification (was tampered with)?',a:['invoice-0424.pdf']},
  {id:'mq4',q:'Why prefer SHA-256 over MD5 for security?',choices:['SHA-256 is faster','MD5 collisions can be crafted deliberately','MD5 only works on text','SHA-256 hashes are shorter'],answer:1},
 ]},
{id:'capstone',title:'15. Capstone challenge',cmds:['all'],
 body:`<p>Time to combine everything. No step-by-step hints this time - use the Docs tab if you need to.</p>
<div class="scenario"><b>Scenario.</b> The security team believes someone set up a <b>hidden web service on files01</b> on a port somewhere between <b>8000 and 8100</b>. It serves a file called <code>flag.txt</code> together with a published SHA-256 checksum.<br><br>
1. Confirm files01 is alive.<br>2. Find the hidden port.<br>3. Download <code>flag.txt</code> <i>and</i> <code>flag.txt.sha256</code>.<br>4. Prove the flag file is intact.<br>5. Finally, investigate the suspicious root listener on <b>localhost port 31337</b> you found with netstat. What can anyone who connects to it do?</div>`,

  {id:'x1',text:'Confirm files01 is alive.',hint:'ping, or hping3',...{on:'any',check:ev=>(ev.t==='ping'&&ev.d.ip==='10.10.10.30'&&ev.d.recv>0)||(ev.t==='hping'&&ev.d.ip==='10.10.10.30'&&ev.d.recv>0)}},

  {id:'x4',text:'Save flag.txt.sha256 from the hidden service.',hint:'curl -O ...',...E('curl-save',d=>/flag\.txt\.sha256$/.test(d.file))},

  {id:'x6',text:'Connect to the root listener on localhost:31337 and run whoami through it.',hint:'nc localhost 31337, then type whoami',...E('bindshell')},
