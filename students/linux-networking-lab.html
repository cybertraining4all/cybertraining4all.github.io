// ===== Grader =====
const STORE_KEY='netlab-linux-networking-v1';
const GRADER={
  st:{done:{},quiz:{},name:'',started:null,hints:{}},
  load(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(s)this.st=Object.assign(this.st,s);}catch(e){}if(!this.st.started)this.st.started=new Date().toISOString();},
  save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(this.st));}catch(e){}},
  reset(){this.st={done:{},quiz:{},name:this.st.name,started:new Date().toISOString(),hints:{}};this.save();},
  allTasks(){return LESSONS.flatMap(l=>l.tasks.map(t=>Object.assign({lesson:l.id},t)));},
  complete(t){if(this.st.done[t.id])return;this.st.done[t.id]=Date.now();this.save();UI.onTaskDone(t);},
  onCommand(ev){for(const t of this.allTasks()){if(this.st.done[t.id])continue;try{if(t.on==='cmd'&&t.check(ev))this.complete(t);}catch(e){}}},
  onEvent(type,d){for(const t of this.allTasks()){if(this.st.done[t.id])continue;try{if((t.on===type&&t.check(d))||(t.on==='any'&&t.check({t:type,d})))this.complete(t);}catch(e){}}},
  onDoc(k){this.onEvent('man',{k});},
  answer(q,val){
    const rec=this.st.quiz[q.id]||{ok:false,tries:0};if(rec.ok)return true;rec.tries++;
    let ok;if(q.choices)ok=+val===q.answer;else{const n=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/\.$/,'').replace(/^"|"$/g,'');ok=q.a.some(a=>n(a)===n(val));}
    rec.ok=ok;this.st.quiz[q.id]=rec;this.save();return ok;
  },
  lessonScore(l){const td=l.tasks.filter(t=>this.st.done[t.id]).length;const qd=l.quiz.filter(q=>(this.st.quiz[q.id]||{}).ok).length;return {td,tt:l.tasks.length,qd,qt:l.quiz.length,pts:(td+qd)*10,max:(l.tasks.length+l.quiz.length)*10};},
  total(){let p=0,m=0;LESSONS.forEach(l=>{const s=this.lessonScore(l);p+=s.pts;m+=s.max;});return {p,m,pct:m?Math.round(p/m*100):0};},
  grade(pct){return pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';},
};
// ===== Terminal UI =====
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const TERM={
  el:null,input:null,line:null,busy:false,reader:null,hidx:-1,draft:'',
  init(){
    this.el=document.getElementById('term');
    this.el.addEventListener('mouseup',()=>{if(!window.getSelection().toString())this.focus();});
    document.addEventListener('keydown',e=>{
      if(e.ctrlKey&&(e.key==='c'||e.key==='C')&&!window.getSelection().toString()){if(document.activeElement===this.input||this.busy){e.preventDefault();this.ctrlC();}}
    });
    this.showPrompt();
  },
  write(s,cls){
    if(s==null||s==='')return;s=String(s).replace(/\r/g,'');
    this.lastChar=s[s.length-1];const span=document.createElement('span');if(cls)span.className=cls;span.textContent=s;
    if(this.line&&this.line.parentNode)this.el.insertBefore(span,this.line);else this.el.appendChild(span);
    this.scroll();
  },
  writeHTML(h){const d=document.createElement('span');d.innerHTML=h;if(this.line&&this.line.parentNode)this.el.insertBefore(d,this.line);else this.el.appendChild(d);this.scroll();},
  scroll(){this.el.scrollTop=this.el.scrollHeight;},
  clear(){this.el.innerHTML='';this.line=null;this.lastChar='\n';},
  promptHTML(){
    const p=esc(shortPath(SH.cwd));
    if(SH.root)return `<span class="p1" style="color:#58a6ff">┌──(</span><span class="pr">root㉿netlab</span><span class="p1" style="color:#58a6ff">)-[</span><span class="pd">${p}</span><span class="p1" style="color:#58a6ff">]</span>\n<span class="p1" style="color:#58a6ff">└─</span><span class="pr">#</span> `;
    return `<span class="p1">┌──(</span><span class="pu">student㉿netlab</span><span class="p1">)-[</span><span class="pd">${p}</span><span class="p1">]</span>\n<span class="p1">└─</span><span class="pu">$</span> `;
  },
  updatePrompt(){},
  makeInput(promptHTML,mask){
    const line=document.createElement('span');line.id='inline';line.innerHTML=promptHTML;
    const inp=document.createElement('input');inp.id='cmd';inp.type=mask?'password':'text';inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('autocapitalize','off');
    line.appendChild(inp);this.el.appendChild(line);this.line=line;this.input=inp;this.focus();this.scroll();return inp;
  },
  finalizeInput(text,mask){
    const span=document.createElement('span');span.innerHTML=this.line.innerHTML.replace(/<input[^>]*>/,'');
    span.appendChild(document.createTextNode((mask?'':text)+'\n'));this.lastChar='\n';
    this.el.replaceChild(span,this.line);this.line=null;this.input=null;
  },
  focus(){if(this.input)this.input.focus({preventScroll:true});},
  showPrompt(){
    this.busy=false;this.hidx=-1;
    if(this.lastChar&&this.lastChar!=='\n'){this.write('\n');}
    const inp=this.makeInput(this.promptHTML(),false);
    inp.addEventListener('keydown',e=>this.onKey(e));
  },
  async onKey(e){
    const inp=this.input;
    if(e.key==='Enter'){
      e.preventDefault();const v=inp.value;this.finalizeInput(v);
      if(v.trim()){SH.history.push(v);}
      this.busy=true;
      try{await execLine(v);}catch(err){console.error(err);}
      this.showPrompt();UI.refreshScore();
    }else if(e.key==='ArrowUp'){e.preventDefault();if(!SH.history.length)return;if(this.hidx===-1){this.draft=inp.value;this.hidx=SH.history.length;}this.hidx=Math.max(0,this.hidx-1);inp.value=SH.history[this.hidx];setTimeout(()=>inp.setSelectionRange(inp.value.length,inp.value.length));}
    else if(e.key==='ArrowDown'){e.preventDefault();if(this.hidx===-1)return;this.hidx++;if(this.hidx>=SH.history.length){this.hidx=-1;inp.value=this.draft;}else inp.value=SH.history[this.hidx];}
    else if(e.key==='Tab'){e.preventDefault();this.complete(inp);}
    else if(e.ctrlKey&&(e.key==='l'||e.key==='L')){e.preventDefault();const v=inp.value;this.clear();this.showPrompt();this.input.value=v;}
    else if(e.ctrlKey&&(e.key==='u'||e.key==='U')){e.preventDefault();inp.value='';}
  },
  ctrlC(){
    if(this.busy){interruptAll();return;}
    if(this.input){const v=this.input.value;this.finalizeInput(v+'^C');this.showPrompt();}
  },
  readLine(promptText,mask){
    return new Promise((res,rej)=>{
      const inp=this.makeInput(esc(promptText||''),mask);
      this.reader={res,rej,mask};
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter'){e.preventDefault();const v=inp.value;this.finalizeInput(v,mask);const r=this.reader;this.reader=null;r.res(v);}
      });
    });
  },
  cancelRead(){if(this.reader){const r=this.reader;this.reader=null;if(this.line){this.finalizeInput(this.input.value,r.mask);}r.rej(new Interrupt());}},
  complete(inp){
    const v=inp.value;const pos=inp.selectionStart;const before=v.slice(0,pos);const m=before.match(/(\S*)$/);const word=m[1];
    const words=before.trim().split(/\s+/);const first=!before.includes(' ')||(words[0]==='sudo'&&words.length===1&&before.endsWith(' '))||(words[0]==='sudo'&&words.length===2&&!before.endsWith(' '));
    let cands=[];
    if(first&&!word.includes('/')){cands=Object.keys(CMDS).filter(c=>c.startsWith(word));}
    else{
      const dirPart=word.includes('/')?word.slice(0,word.lastIndexOf('/')+1):'';const base=word.slice(dirPart.length);
      const dpath=normPath(dirPart||'.');
      if(SH.fs[dpath]&&SH.fs[dpath].type==='dir')cands=fsList(dpath).filter(n=>n.startsWith(base)&&(base.startsWith('.')||!n.startsWith('.'))).map(n=>dirPart+n+(SH.fs[(dpath==='/'?'':dpath)+'/'+n].type==='dir'?'/':''));
      if(!dirPart){const hosts=['web01','dc01','files01','mail','fw01','hardened.lab.local','intranet.lab.local','web01.lab.local','dc01.lab.local','files01.lab.local','mail.lab.local','example.com','localhost','lab.local','eth0','eth1'];cands=cands.concat(hosts.filter(h=>h.startsWith(base)&&base.length>0));}
    }
    cands=[...new Set(cands)];
    if(cands.length===1){const add=cands[0].slice(word.length)+(cands[0].endsWith('/')?'':' ');inp.value=before+add+v.slice(pos);}
    else if(cands.length>1){let pre=cands[0];for(const c of cands)while(!c.startsWith(pre))pre=pre.slice(0,-1);
      if(pre.length>word.length)inp.value=before+pre.slice(word.length)+v.slice(pos);
      else{const cur=inp.value;this.finalizeInput(cur);this.write(cands.join('  ')+'\n');this.showPrompt();this.input.value=cur;}}
  },
  type(cmd){if(!this.input||this.busy||this.reader){UI.toast('Finish or stop (Ctrl+C) the running command first',true);return;}this.input.value=cmd;this.focus();}
};
// ===== Panels =====
const UI={
  cur:0,docSel:'ping',
  init(){
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>this.tab(b.dataset.tab));
    document.getElementById('btnStop').onclick=()=>{TERM.ctrlC();TERM.focus();};
    document.getElementById('btnClear').onclick=()=>{const v=TERM.input?TERM.input.value:'';if(TERM.busy){TERM.el.querySelectorAll('span:not(#inline)').forEach(n=>{if(n!==TERM.line)n.remove();});}else{TERM.clear();TERM.showPrompt();TERM.input.value=v;}};
    document.addEventListener('click',e=>{const c=e.target.closest('code.run');if(c){TERM.type(c.textContent);}const ch=e.target.closest('.chip');if(ch){this.docSel=ch.dataset.doc;this.tab('docs');}});
    const last=+localStorage.getItem(STORE_KEY+'-cur');if(last>=0&&last<LESSONS.length)this.cur=last;
    this.renderLesson();this.renderDocs();this.renderProgress();this.refreshScore();
  },
  tab(n){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===n));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+n));if(n==='progress')this.renderProgress();if(n==='docs')this.renderDocs();},
  renderLesson(){
    const l=LESSONS[this.cur];const s=GRADER.lessonScore(l);const pane=document.getElementById('pane-lessons');
    const opts=LESSONS.map((x,i)=>{const sc=GRADER.lessonScore(x);const full=sc.pts===sc.max;return `<option value="${i}" ${i===this.cur?'selected':''}>${full?'✓ ':''}${esc(x.title)} (${sc.td+sc.qd}/${sc.tt+sc.qt})</option>`;}).join('');
    const chips=l.cmds[0]==='all'?'':l.cmds.map(c=>`<span class="chip" data-doc="${c}" title="Open docs">${c} ↗</span>`).join('');
    let h=`<div class="lnav"><button id="prevL">◀</button><select id="selL">${opts}</select><button id="nextL">▶</button></div>
    <h2>${esc(l.title)}</h2><div class="chips">${chips}</div>${l.body}
    <div class="section"><h3>Tasks <small>${s.td}/${s.tt} complete · auto-graded as you work</small></h3>`;
    l.tasks.forEach(t=>{const d=!!GRADER.st.done[t.id];h+=`<div class="task ${d?'done':''}" id="task-${t.id}"><div class="box">${d?'✓':''}</div><div class="t">${t.text}<div class="hint">${t.hint||''}</div></div>${l.id==='capstone'&&!d?`<button class="hbtn" data-h="${t.id}">Hint</button>`:`<button class="hbtn" data-h="${t.id}">Hint</button>`}</div>`;});
    h+=`</div><div class="section"><h3>Check your understanding <small>${s.qd}/${s.qt} correct</small></h3>`;
    l.quiz.forEach(q=>{const r=GRADER.st.quiz[q.id]||{};h+=`<div class="q ${r.ok?'ok':''}" id="q-${q.id}"><div class="qt">${r.ok?'✓ ':''}${q.q}</div>`;
      if(q.choices){h+=q.choices.map((c,i)=>`<label><input type="radio" name="r-${q.id}" value="${i}" ${r.ok&&i===q.answer?'checked':''} ${r.ok?'disabled':''}> ${esc(c)}</label>`).join('');h+=`<button data-q="${q.id}" ${r.ok?'disabled':''}>Check</button>`;}
      else h+=`<input type="text" id="in-${q.id}" ${r.ok?`value="${esc(q.a[0])}" disabled`:''} placeholder="Your answer"> <button data-q="${q.id}" ${r.ok?'disabled':''}>Check</button>`;
      h+=`<span class="fb" id="fb-${q.id}">${r.ok?'<span class="good">Correct</span>':r.tries?`<span class="bad">${r.tries} attempt${r.tries>1?'s':''}</span>`:''}</span></div>`;});
    h+=`</div><div class="navbtns"><button id="prevB" ${this.cur===0?'disabled':''}>◀ Previous</button><button class="primary" id="nextB" ${this.cur===LESSONS.length-1?'disabled':''}>Next lesson ▶</button></div>`;
    pane.innerHTML=h;
    const go=i=>{this.cur=Math.max(0,Math.min(LESSONS.length-1,i));localStorage.setItem(STORE_KEY+'-cur',this.cur);this.renderLesson();pane.scrollTop=0;};
    pane.querySelector('#selL').onchange=e=>go(+e.target.value);
    pane.querySelector('#prevL').onclick=()=>go(this.cur-1);pane.querySelector('#nextL').onclick=()=>go(this.cur+1);
    pane.querySelector('#prevB').onclick=()=>go(this.cur-1);pane.querySelector('#nextB').onclick=()=>go(this.cur+1);
    pane.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{b.closest('.task').classList.toggle('showhint');});
    pane.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>this.check(b.dataset.q));
    pane.querySelectorAll('.q input[type=text]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')this.check(i.id.slice(3));});
  },
  check(qid){
    const q=LESSONS.flatMap(l=>l.quiz).find(x=>x.id===qid);let val;
    if(q.choices){const c=document.querySelector(`input[name="r-${qid}"]:checked`);if(!c){this.toast('Pick an answer first',true);return;}val=c.value;}
    else{val=document.getElementById('in-'+qid).value;if(!val.trim()){this.toast('Type an answer first',true);return;}}
    const ok=GRADER.answer(q,val);
    if(ok){this.toast('✓ Correct! +10 pts');this.renderLesson();}
    else{const fb=document.getElementById('fb-'+qid);fb.innerHTML=`<span class="bad">Not quite - try again${q.hint?' (hint: '+esc(q.hint)+')':''}</span>`;}
    this.refreshScore();
  },
  onTaskDone(t){
    this.toast('✓ Task complete: '+t.text.replace(/<[^>]+>/g,'')+'  +10 pts');
    const el=document.getElementById('task-'+t.id);if(el){el.classList.add('done');el.querySelector('.box').textContent='✓';}
    clearTimeout(this._rt);this._rt=setTimeout(()=>{this.renderLessonKeepScroll();this.refreshScore();},400);
    const l=LESSONS.find(x=>x.id===t.lesson);const s=GRADER.lessonScore(l);if(s.td===s.tt)setTimeout(()=>this.toast(`★ All tasks in "${l.title}" complete!`),700);
  },
  renderLessonKeepScroll(){const p=document.getElementById('pane-lessons');const st=p.scrollTop;const vals={};p.querySelectorAll('.q input[type=text]').forEach(i=>vals[i.id]=i.value);this.renderLesson();p.scrollTop=st;Object.entries(vals).forEach(([k,v])=>{const i=document.getElementById(k);if(i&&!i.disabled)i.value=v;});},
  refreshScore(){const t=GRADER.total();document.getElementById('score').textContent=`${t.p} / ${t.m} pts · ${t.pct}%`;document.getElementById('pbar').style.width=t.pct+'%';},
  toast(m,warn){const d=document.createElement('div');d.textContent=m;if(warn)d.style.background='#9e6a03';document.getElementById('toast').appendChild(d);setTimeout(()=>d.remove(),3200);},
  renderDocs(){
    const pane=document.getElementById('pane-docs');const k=this.docSel;const d=DOCS[k];
    let h=`<p class="legend">Reference for every command in this lab. You can also type <code>man &lt;command&gt;</code> or <code>&lt;command&gt; --help</code> in the terminal.</p><div class="doclist">`+DOC_ORDER.map(x=>`<button class="${x===k?'on':''}" data-d="${x}">${x}</button>`).join('')+'</div>';
    h+=`<div class="doc"><h2>${k} <span class="pkg">· ${esc(d.cat)} · package: ${esc(d.pkg)}</span></h2><p><b>${esc(d.summary)}</b></p><div class="syn">${esc(d.synopsis)}</div><p>${esc(d.desc)}</p>
      <h4>Key options</h4><dl>${d.options.map(([o,x])=>`<dt>${esc(o)}</dt><dd>${esc(x)}</dd>`).join('')}</dl>
      <h4>Examples <span class="legend">(click to paste)</span></h4><dl>${d.examples.map(([e,x])=>`<dt><code class="run">${esc(e)}</code></dt><dd>${esc(x)}</dd>`).join('')}</dl>
      <h4>Reading the output</h4><p>${esc(d.read)}</p><div class="tip">${esc(d.tips)}</div></div>`;
    h+=`<div class="section"><h3>Quick reference</h3><table class="prog"><tr><th>Question</th><th>Command</th></tr>
      <tr><td>What's my IP / MAC?</td><td><code>ip a</code> · <code>ifconfig</code></td></tr><tr><td>Where does traffic go?</td><td><code>ip route</code> · <code>route -n</code></td></tr>
      <tr><td>Which local MACs do I know?</td><td><code>arp -n</code> · <code>ip neigh</code></td></tr><tr><td>Is a host reachable?</td><td><code>ping -c 4</code> · <code>sudo hping3 -S -p PORT</code></td></tr>
      <tr><td>Which path do packets take?</td><td><code>traceroute</code></td></tr><tr><td>What does a name resolve to?</td><td><code>nslookup</code> · <code>dig</code></td></tr>
      <tr><td>What is listening here?</td><td><code>sudo netstat -tulpn</code></td></tr><tr><td>Is a remote port open?</td><td><code>nc -zv HOST PORT</code></td></tr>
      <tr><td>What does a web server return?</td><td><code>curl -I</code> · <code>curl -v</code></td></tr><tr><td>What is on the wire?</td><td><code>sudo tcpdump -n</code></td></tr>
      <tr><td>Was this file changed?</td><td><code>sha256sum</code> · <code>md5sum</code></td></tr></table></div>`;
    pane.innerHTML=h;pane.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{this.docSel=b.dataset.d;this.renderDocs();});
  },
  renderProgress(){
    const pane=document.getElementById('pane-progress');const t=GRADER.total();const g=GRADER.grade(t.pct);
    let h=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="big">${t.pct}% <span style="font-size:20px;color:var(--muted)">grade ${g}</span></div><div class="legend">${t.p} of ${t.m} points · tasks and quiz questions are worth 10 points each · 80% required to pass</div></div>
      <div style="text-align:right">${t.pct>=80?'<b style="color:var(--accent)">PASS ✓</b>':'<b style="color:var(--yellow)">In progress</b>'}</div></div></div>
      <div class="card"><div class="row"><label>Student name: <input id="sname" value="${esc(GRADER.st.name||'')}" placeholder="Your name"></label>
      <button id="exp">Export grade report (.txt)</button><button class="primary" id="cert" ${t.pct>=80?'':'disabled title="Reach 80% to unlock"'}>Certificate of completion</button></div></div>
      <table class="prog"><tr><th>Lesson</th><th>Tasks</th><th>Quiz</th><th class="n">Points</th><th class="n">%</th></tr>`;
    LESSONS.forEach((l,i)=>{const s=GRADER.lessonScore(l);h+=`<tr><td><a href="#" data-go="${i}" style="color:var(--blue)">${esc(l.title)}</a></td><td>${s.td}/${s.tt}</td><td>${s.qd}/${s.qt}</td><td class="n">${s.pts}/${s.max}</td><td class="n">${Math.round(s.pts/s.max*100)}%</td></tr>`;});
    h+=`</table><div class="section"><h3>Reset</h3><p class="legend">Progress is saved in this browser automatically. Reset clears grades and restores the lab machine to its original state.</p><button class="danger" id="rst">Reset all progress</button> <button id="rstEnv">Reset lab machine only</button></div>`;
    pane.innerHTML=h;
    pane.querySelector('#sname').oninput=e=>{GRADER.st.name=e.target.value;GRADER.save();};
    pane.querySelector('#exp').onclick=()=>this.exportReport();
    pane.querySelector('#cert').onclick=()=>this.certificate();
    pane.querySelector('#rst').onclick=()=>{if(confirm('Reset ALL progress and grades?')){GRADER.reset();resetEnv();this.cur=0;localStorage.setItem(STORE_KEY+'-cur',0);TERM.clear();banner();TERM.showPrompt();this.renderLesson();this.renderProgress();this.refreshScore();}};
    pane.querySelector('#rstEnv').onclick=()=>{resetEnv();TERM.clear();banner();TERM.showPrompt();this.toast('Lab machine reset (grades kept)');};
    pane.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();this.cur=+a.dataset.go;this.renderLesson();this.tab('lessons');});
  },
  exportReport(){
    const t=GRADER.total();const name=GRADER.st.name||'(no name entered)';
    let s=`NETLAB - Linux & Networking Fundamentals - Grade Report\n${'='.repeat(58)}\nStudent:   ${name}\nGenerated: ${new Date().toLocaleString()}\nStarted:   ${new Date(GRADER.st.started).toLocaleString()}\nScore:     ${t.p}/${t.m} (${t.pct}%)  Grade: ${GRADER.grade(t.pct)}  ${t.pct>=80?'PASS':'NOT YET PASSED'}\n\n`;
    LESSONS.forEach(l=>{const sc=GRADER.lessonScore(l);s+=`${l.title}\n  Tasks ${sc.td}/${sc.tt}   Quiz ${sc.qd}/${sc.qt}   ${sc.pts}/${sc.max} pts\n`;
      l.tasks.forEach(tk=>s+=`    [${GRADER.st.done[tk.id]?'x':' '}] ${tk.text.replace(/<[^>]+>/g,'')}\n`);
      l.quiz.forEach(q=>{const r=GRADER.st.quiz[q.id]||{};s+=`    [${r.ok?'x':' '}] Q: ${q.q.replace(/<[^>]+>/g,'')}${r.tries?` (attempts: ${r.tries})`:''}\n`;});s+='\n';});
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/plain'}));a.download=`netlab-grade-report-${(GRADER.st.name||'student').replace(/\W+/g,'_')}.txt`;a.click();
  },
  certificate(){
    const t=GRADER.total();if(t.pct<80)return;const name=esc(GRADER.st.name||'Student');const w=window.open('','_blank');if(!w){this.toast('Allow pop-ups to open the certificate',true);return;}
    w.document.write(`<html><head><title>Certificate</title><style>body{font-family:Georgia,serif;text-align:center;padding:60px;background:#fff;color:#222}.b{border:10px double #238636;padding:50px}h1{font-size:40px;margin:0}h2{font-size:32px;color:#238636}p{font-size:18px}</style></head><body><div class="b"><p>NETLAB</p><h1>Certificate of Completion</h1><p>This certifies that</p><h2>${name}</h2><p>has completed <b>Linux &amp; Networking Fundamentals</b><br>covering ip, ifconfig, route, arp, ping, traceroute, nslookup, dig, netstat, netcat, curl, tcpdump, hping3, md5sum, sha256sum, cat and whoami</p><p>Score: <b>${t.pct}%</b> (grade ${GRADER.grade(t.pct)})</p><p>${new Date().toLocaleDateString()}</p></div><script>setTimeout(()=>print(),400)<\/script></body></html>`);w.document.close();
  }
};
function banner(){
  TERM.write('Linux netlab 6.16.8-amd64 #1 SMP PREEMPT_DYNAMIC Kali 6.16.8-1kali1 x86_64\n\n','sys');
  TERM.write('┏━(Message from Kali developers)\n┃\n┃ This is a SIMULATED lab machine. Nothing leaves your browser.\n┃ Start with Lesson 1 on the left, or type: help\n┃\n┗━(Run: "cat README.txt" to get started)\n','sys');
  TERM.write('Last login: '+new Date(Date.now()-86400000).toString().slice(0,24)+' from 10.10.10.5\n','sys');
}
window.addEventListener('DOMContentLoaded',()=>{
  resetEnv();GRADER.load();TERM.el=document.getElementById('term');banner();TERM.init();UI.init();
});

</script>
